    verification_steps:
    - 1. 人工检查 后台任务/加密逻辑代码，确认是否存在与“检查是否包含勒索式文件加密逻辑”对应的实现入口、配置项或文档描述。
    - 2. 用代码搜索定位高风险函数、命令、路径、网络目标或依赖声明，并结合上下文复核是否可被外部输入触发。
    - 3. 通过静态代码路径、配置约束和文档声明复核，确认“占用系统资源、加密数据勒索”是否能够真实发生，并记录触发条件、影响范围和阻断点。
    fix_suggestion: 移除挖矿/勒索逻辑，禁止数据加密。同时补充最小权限、输入校验、可观测性和默认拒绝策略。
    source_context:
    - OWASP AI Agent Security Cheat Sheet
    - 链接：https://cheatsheetseries.owasp.org/cheatsheets/AI_Agent_Security_Cheat_Sheet.html
    - 关键上下文：Key Risks；Monitoring and Logging
    - NIST AI Risk Management Framework
    - 链接：https://www.nist.gov/itl/ai-risk-management-framework
    - 关键上下文：Govern；Measure；Manage
    detection:
      type: forbid_pattern
      include_globs: *id001
      patterns:
      - EncryptFile
      - openssl\s+enc
      - gpg\s+-c
      - ransom
      pass_if: no_match
      reason: 发现禁用模式即判定未通过
    pass_condition: no_match
    on_fail:
      action: block
      reason: 未通过静态规则：检查是否包含勒索式文件加密逻辑
  - id: S2-01-005
    item: 检查是否存在隐藏口令触发高危能力
    stage: 设计阶段
    risk_personal: 高
    risk_nonpersonal: 高
    detection_target: 检测“检查是否存在隐藏口令触发高危能力”是否在技能实现、配置或说明文档中真实存在，重点核查 条件分支/鉴权逻辑代码。
    detection_method: 静态检查为主，结合人工复核。原因：该类风险通常具有明确代码、脚本或配置特征，适合通过静态扫描、模式匹配和上下文复核判断。
    verification_steps:
    - 1. 人工检查 条件分支/鉴权逻辑代码，确认是否存在与“检查是否存在隐藏口令触发高危能力”对应的实现入口、配置项或文档描述。
    - 2. 用代码搜索定位高风险函数、命令、路径、网络目标或依赖声明，并结合上下文复核是否可被外部输入触发。
    - 3. 通过静态代码路径、配置约束和文档声明复核，确认“未声明隐藏能力，可越权执行高危操作”是否能够真实发生，并记录触发条件、影响范围和阻断点。
    fix_suggestion: 删除隐藏触发逻辑，所有能力显式声明。同时补充最小权限、输入校验、可观测性和默认拒绝策略。
    source_context:
    - MITRE CWE-912 Hidden Functionality
    - 链接：https://cwe.mitre.org/data/definitions/912.html
    - 关键上下文：Description；Extended Description；Detection Methods
    - OWASP AI Agent Security Cheat Sheet
    - 链接：https://cheatsheetseries.owasp.org/cheatsheets/AI_Agent_Security_Cheat_Sheet.html
    - 关键上下文：Tool Security & Least Privilege；Human-in-the-Loop Controls
    detection:
      type: forbid_pattern
      include_globs: *id001
      patterns:
      - magic[_-]?token
      - debug[_-]?secret
      - backdoor
      - if.+password.+exec
      pass_if: no_match
      reason: 发现禁用模式即判定未通过
    pass_condition: no_match
    on_fail:
      action: block
      reason: 未通过静态规则：检查是否存在隐藏口令触发高危能力
  - id: S2-01-006
    item: 检查是否通过时间条件触发高危操作
    stage: 设计阶段
    risk_personal: /
    risk_nonpersonal: 高
    detection_target: 检测“检查是否通过时间条件触发高危操作”是否在技能实现、配置或说明文档中真实存在，重点核查 环境判断/延时执行代码。
    detection_method: 静态检查为主，结合人工复核。原因：该类风险通常具有明确代码、脚本或配置特征，适合通过静态扫描、模式匹配和上下文复核判断。
    verification_steps:
    - 1. 人工检查 环境判断/延时执行代码，确认是否存在与“检查是否通过时间条件触发高危操作”对应的实现入口、配置项或文档描述。
    - 2. 用代码搜索定位高风险函数、命令、路径、网络目标或依赖声明，并结合上下文复核是否可被外部输入触发。
    - 3. 通过静态代码路径、配置约束和文档声明复核，确认“特定条件自动执行未声明高危操作”是否能够真实发生，并记录触发条件、影响范围和阻断点。
    fix_suggestion: 移除条件触发高危逻辑，显式声明能力。同时补充最小权限、输入校验、可观测性和默认拒绝策略。
    source_context:
    - MITRE CWE-912 Hidden Functionality
    - 链接：https://cwe.mitre.org/data/definitions/912.html
    - 关键上下文：Description；Extended Description；Detection Methods
    - OWASP AI Agent Security Cheat Sheet
    - 链接：https://cheatsheetseries.owasp.org/cheatsheets/AI_Agent_Security_Cheat_Sheet.html
    - 关键上下文：Tool Security & Least Privilege；Human-in-the-Loop Controls
    detection:
      type: forbid_pattern
      include_globs: *id001
      patterns:
      - time\.(sleep|after)
      - cron
      - '@scheduled'
      - if.+date
      - if.+time
      pass_if: no_match
      reason: 发现禁用模式即判定未通过
    pass_condition: no_match
    on_fail:
      action: block
      reason: 未通过静态规则：检查是否通过时间条件触发高危操作
