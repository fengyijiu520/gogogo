- id: S2-G07
  category: 网络与外联安全类
  enforcement_mapping:
    high: block
    medium: require_review
    low: record_and_pass
  items:
  - id: S2-07-001
    item: 检查是否可向内网或元数据地址发起请求
    stage: 设计阶段
    risk_personal: 高
    risk_nonpersonal: 低
    detection_target: 检测“检查是否可向内网或元数据地址发起请求”是否在技能实现、配置或说明文档中真实存在，重点核查 URL请求/网络调用代码。
    detection_method: 静态分析+人工复核。原因：该类风险需要结合文档、配置、数据流和执行路径综合判断，单一模式匹配覆盖不足。
    verification_steps:
    - 1. 人工检查 URL请求/网络调用代码，确认是否存在与“检查是否可向内网或元数据地址发起请求”对应的实现入口、配置项或文档描述。
    - 2. 用代码搜索定位高风险函数、命令、路径、网络目标或依赖声明，并结合上下文复核是否可被外部输入触发。
    - 3. 通过静态代码路径、配置约束和文档声明复核，确认“可访问内网/metadata服务，造成内网渗透”是否能够真实发生，并记录触发条件、影响范围和阻断点。
    fix_suggestion: 启用私网IP拦截，配置目标白名单。同时补充最小权限、输入校验、可观测性和默认拒绝策略。
    source_context:
    - OWASP SSRF Prevention Cheat Sheet
    - 链接：https://cheatsheetseries.owasp.org/cheatsheets/Server_Side_Request_Forgery_Prevention_Cheat_Sheet.html
    - 关键上下文：IP Allowlist；Redirect Validation
    - OWASP Transport Layer Protection Cheat Sheet
    - 链接：https://cheatsheetseries.owasp.org/cheatsheets/Transport_Layer_Protection_Cheat_Sheet.html
    - 关键上下文：TLS Validation；Sensitive Data in Transit
    detection:
      type: forbid_pattern
      include_globs: *id001
      patterns:
      - 169\.254\.169\.254
      - 127\.0\.0\.1
      - localhost
      - 10\.
      - 192\.168\.
      - 172\.(1[6-9]|2\d|3[01])\.
      pass_if: no_match
      reason: 发现禁用模式即判定未通过
    pass_condition: no_match
