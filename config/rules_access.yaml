    - 1. 检查数据存储配置中是否存在保留期限和过期清理规则。
    - 2. 复核不同存储介质是否都被纳入清理范围。
    - 3. 通过静态扫描与配置复核确认过期数据是否会按规则被自动清理。
    fix_suggestion: 为敏感数据设置明确保留期限并自动清理过期数据。
    source_context:
    - OWASP User Privacy Protection Cheat Sheet
    - 链接：https://cheatsheetseries.owasp.org/cheatsheets/User_Privacy_Protection_Cheat_Sheet.html
    - 关键上下文：Data Retention；Delete Unneeded Data
    - NIST AI Risk Management Framework
    - 链接：https://www.nist.gov/itl/ai-risk-management-framework
    - 关键上下文：Govern；Manage
    detection:
      type: require_pattern
      include_globs: *id002
      patterns:
      - ttl
      - expire
      - retention
      - delete_after
      pass_if: match_found
      reason: 必须发现控制证据才判定通过
    pass_condition: match_found
    on_fail:
      action: require_review
      reason: 未通过静态规则：检查是否缺少数据保留期限控制
  - id: S2-02-019
    item: 检查是否缺少非人类身份凭据到期轮换机制
    stage: 设计阶段
    risk_personal: 高
    risk_nonpersonal: 中
    detection_target: 检测技能是否为非人类身份凭据设置到期与轮换机制，重点核查凭据 TTL、轮换配置和生效路径。
    detection_method: 静态分析+凭据策略复核+隔离验证。原因：需要同时确认配置存在、轮换路径可执行以及旧凭据能失效。
    verification_steps:
    - 1. 检查非人类身份凭据是否配置 TTL、到期时间或轮换周期。
    - 2. 复核轮换触发方式、失败处理和旧凭据失效策略。
    - 3. 通过静态扫描与配置复核确认到期后旧凭据是否被拒绝，新凭据是否可替换生效。
    fix_suggestion: 为非人类身份凭据设置固定轮换周期和过期失效策略。
    source_context:
    - OWASP Secrets Management Cheat Sheet
    - 链接：https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html
    - 关键上下文：2.6 Dynamic Secrets；2.7 Rotation；2.8 Revocation
    - NIST AI Risk Management Framework
    - 链接：https://www.nist.gov/itl/ai-risk-management-framework
    - 关键上下文：Measure；Manage
    detection:
      type: require_pattern
      include_globs: *id002
      patterns:
      - rotation
      - ttl
      - expires_at
      - rotate[_-]?token
      pass_if: match_found
      reason: 必须发现控制证据才判定通过
    pass_condition: match_found
    on_fail:
      action: require_review
      reason: 未通过静态规则：检查是否缺少非人类身份凭据到期轮换机制
  - id: S2-02-020
    item: 检查是否缺少非人类身份凭据吊销机制
    stage: 设计阶段
    risk_personal: 高
    risk_nonpersonal: 中
    detection_target: 检测技能是否提供非人类身份凭据吊销机制，重点核查吊销入口、失效传播和紧急阻断能力。
    detection_method: 静态分析+凭据策略复核+隔离验证。原因：吊销风险取决于入口存在性和失效传播完整性，需要实际验证。
    verification_steps:
    - 1. 检查凭据管理中是否存在吊销或失效入口。
    - 2. 复核吊销后旧凭据在缓存、会话和调用链中的失效传播是否完整。
    - 3. 通过静态扫描与配置复核确认被吊销凭据是否无法继续访问敏感能力。
    fix_suggestion: 补充凭据吊销和紧急失效流程，支持泄露后快速阻断。
    source_context:
    - OWASP Secrets Management Cheat Sheet
    - 链接：https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html
    - 关键上下文：2.3 Access Control；2.8 Revocation
    - NIST AI Risk Management Framework
    - 链接：https://www.nist.gov/itl/ai-risk-management-framework
    - 关键上下文：Measure；Manage
    detection:
      type: require_pattern
      include_globs: *id002
      patterns:
      - revoke
      - revocation
      - invalidate
      - disable[_-]?token
      pass_if: match_found
      reason: 必须发现控制证据才判定通过
    pass_condition: match_found
    on_fail:
      action: require_review
      reason: 未通过静态规则：检查是否缺少非人类身份凭据吊销机制
  - id: S2-02-021
    item: 检查是否缺少长期记忆按用户或任务隔离机制
    stage: 设计阶段
    risk_personal: 高
    risk_nonpersonal: 中
    detection_target: 检测长期记忆是否按用户或任务隔离，重点核查记忆存储键、租户边界和读取条件。
    detection_method: 静态分析+存储结构复核+隔离验证。原因：需要同时确认存储隔离设计和读取边界是否真实成立。
    verification_steps:
    - 1. 检查长期记忆或向量库存储结构，确认是否包含用户或任务隔离键。
    - 2. 复核读取逻辑是否可能跨用户、跨任务命中记忆内容。
    - 3. 通过静态扫描与配置复核确认一个任务写入的记忆是否会被另一个任务直接读取。
    fix_suggestion: 将长期记忆按用户、任务或租户隔离存储，阻止串写串读。
    source_context:
    - OWASP Top 10 for LLM Applications - LLM06 Sensitive Information Disclosure
    - 链接：https://genai.owasp.org/llm-top-10/llm06-sensitive-information-disclosure/
    - 关键上下文：Description；Example Attack Scenarios；Prevention and Mitigation
    - OWASP AI Agent Security Cheat Sheet
    - 链接：https://cheatsheetseries.owasp.org/cheatsheets/AI_Agent_Security_Cheat_Sheet.html
    - 关键上下文：Memory Safety；Multi-Agent Environment；Least Privilege
    detection:
      type: require_pattern
      include_globs: *id002
      patterns:
      - user[_-]?id
      - tenant[_-]?id
      - task[_-]?id
      - namespace
      pass_if: match_found
      reason: 必须发现控制证据才判定通过
    pass_condition: match_found
    on_fail:
      action: require_review
      reason: 未通过静态规则：检查是否缺少长期记忆按用户或任务隔离机制
  - id: S2-02-022
    item: 检查是否缺少长期记忆污染清理机制
    stage: 设计阶段
    risk_personal: 高
    risk_nonpersonal: 中
    detection_target: 检测长期记忆是否提供污染清理机制，重点核查来源标记、审核流程和清理入口。
    detection_method: 静态分析+记忆治理复核+隔离验证。原因：污染问题取决于来源标记、审核和清理机制是否完整。
    verification_steps:
    - 1. 检查长期记忆是否对写入来源、可信度和审核状态进行标记。
    - 2. 复核是否存在污染内容识别、清理或回滚流程。
    - 3. 通过静态扫描与配置复核确认可疑记忆写入后是否能被识别并移除。
    fix_suggestion: 增加记忆来源标记、审核和清理流程，阻断污染内容长期驻留。
    source_context:
    - OWASP Top 10 for LLM Applications - LLM01 Prompt Injection
    - 链接：https://genai.owasp.org/llm-top-10/llm01-prompt-injection/
    - 关键上下文：Description；Indirect Prompt Injection；Prevention and Mitigation
    - OWASP AI Agent Security Cheat Sheet
    - 链接：https://cheatsheetseries.owasp.org/cheatsheets/AI_Agent_Security_Cheat_Sheet.html
    - 关键上下文：Memory Safety；Plan-then-Execute；Monitoring and Logging
    detection:
      type: require_pattern
      include_globs: *id002
      patterns:
      - clean
      - purge
      - memory[_-]?reset
      - quarantine
      pass_if: match_found
      reason: 必须发现控制证据才判定通过
    pass_condition: match_found
    on_fail:
      action: require_review
      reason: 未通过静态规则：检查是否缺少长期记忆污染清理机制
- id: S2-G03
  category: 合规与审计类
  enforcement_mapping:
    high: block
    medium: require_review
    low: record_and_pass
  items:
  - id: S2-03-001
    item: 检查是否存在未在文档中披露的高危能力
    stage: 设计阶段
    risk_personal: /
    risk_nonpersonal: 中
    detection_target: 检测“检查是否存在未在文档中披露的高危能力”是否在技能实现、配置或说明文档中真实存在，重点核查 SKILL.md/README.md、源码能力清单。
    detection_method: 静态分析+人工复核。原因：该类风险需要结合文档、配置、数据流和执行路径综合判断，单一模式匹配覆盖不足。
    verification_steps:
    - 1. 人工检查 SKILL.md/README.md、源码能力清单，确认是否存在与“检查是否存在未在文档中披露的高危能力”对应的实现入口、配置项或文档描述。
    - 2. 用代码搜索定位高风险函数、命令、路径、网络目标或依赖声明，并结合上下文复核是否可被外部输入触发。
    - 3. 通过静态代码路径、配置约束和文档声明复核，确认“声明未提及外联/执行/文件读写等高风险能力”是否能够真实发生，并记录触发条件、影响范围和阻断点。
    fix_suggestion: 补全声明文档，同步实际能力与权限。同时补充最小权限、输入校验、可观测性和默认拒绝策略。
    source_context:
    - NIST AI Risk Management Framework
    - 链接：https://www.nist.gov/itl/ai-risk-management-framework
    - 关键上下文：Govern；Manage
    - OWASP AI Agent Security Cheat Sheet
    - 链接：https://cheatsheetseries.owasp.org/cheatsheets/AI_Agent_Security_Cheat_Sheet.html
    - 关键上下文：Human-in-the-Loop Controls；Monitoring and Logging
    detection:
      type: code_vs_docs
      include_globs: *id001
      code_include_globs: *id001
      code_patterns:
      - os\.system
      - subprocess
      - fetch\(
      - axios
      - open\(
      - requests\.
      - httpx\.
      - socket
      doc_globs: &id003
      - '**/*.md'
      - SKILL.md
      - README*
      - docs/**/*.md
      - '**/*.yaml'
      - '**/*.yml'
      - '**/*.json'
      doc_include_globs: *id003
      doc_patterns:
      - 执行
      - 命令
      - 外联
      - 网络
      - 文件
      - 读写
      - 数据处理
      pass_if: no_code_match_or_doc_match
      reason: 发现高风险能力实现时，文档中必须有对应声明证据
    pass_condition: no_code_match_or_doc_match
    on_fail:
      action: require_review
      reason: 未通过静态规则：检查是否存在未在文档中披露的高危能力
  - id: S2-03-002
    item: 检查是否完整声明文件、网络、执行与数据处理能力
    stage: 设计阶段
    risk_personal: /
    risk_nonpersonal: 中
    detection_target: 检测“检查是否完整声明文件、网络、执行与数据处理能力”是否在技能实现、配置或说明文档中真实存在，重点核查 声明文档、权限说明。
    detection_method: 静态分析+人工复核。原因：该类风险需要结合文档、配置、数据流和执行路径综合判断，单一模式匹配覆盖不足。
    verification_steps:
    - 1. 人工检查 声明文档、权限说明，确认是否存在与“检查是否完整声明文件、网络、执行与数据处理能力”对应的实现入口、配置项或文档描述。
    - 2. 用代码搜索定位高风险函数、命令、路径、网络目标或依赖声明，并结合上下文复核是否可被外部输入触发。
    - 3. 通过静态代码路径、配置约束和文档声明复核，确认“能力声明缺失、不完整，用户无法感知风险”是否能够真实发生，并记录触发条件、影响范围和阻断点。
    fix_suggestion: 补全权限、网络、文件、数据处理声明。同时补充最小权限、输入校验、可观测性和默认拒绝策略。
    source_context:
    - NIST AI Risk Management Framework
    - 链接：https://www.nist.gov/itl/ai-risk-management-framework
    - 关键上下文：Govern；Manage
    - OWASP AI Agent Security Cheat Sheet
    - 链接：https://cheatsheetseries.owasp.org/cheatsheets/AI_Agent_Security_Cheat_Sheet.html
    - 关键上下文：Human-in-the-Loop Controls；Monitoring and Logging
    detection:
      type: require_pattern
      include_globs: *id003
      patterns:
      - 文件
      - 网络
      - 执行
      - 数据
      pass_if: match_found
      reason: 必须发现控制证据才判定通过
    pass_condition: match_found
    on_fail:
      action: require_review
      reason: 未通过静态规则：检查是否完整声明文件、网络、执行与数据处理能力
  - id: S2-03-003
    item: 检查是否对不可逆高影响操作缺少显式确认
    stage: 设计阶段
    risk_personal: /
    risk_nonpersonal: 低
    detection_target: 检测“检查是否对不可逆高影响操作缺少显式确认”是否在技能实现、配置或说明文档中真实存在，重点核查 删除/支付/发信等高影响操作代码。
    detection_method: 静态分析+人工复核。原因：该类风险需要结合文档、配置、数据流和执行路径综合判断，单一模式匹配覆盖不足。
    verification_steps:
    - 1. 人工检查 删除/支付/发信等高影响操作代码，确认是否存在与“检查是否对不可逆高影响操作缺少显式确认”对应的实现入口、配置项或文档描述。
    - 2. 用代码搜索定位高风险函数、命令、路径、网络目标或依赖声明，并结合上下文复核是否可被外部输入触发。
    - 3. 通过静态代码路径、配置约束和文档声明复核，确认“高危操作无预览/确认，误操作不可逆”是否能够真实发生，并记录触发条件、影响范围和阻断点。
    fix_suggestion: 增加预览、明确确认、取消/超时回滚。同时补充最小权限、输入校验、可观测性和默认拒绝策略。
    source_context:
    - NIST AI Risk Management Framework
    - 链接：https://www.nist.gov/itl/ai-risk-management-framework
    - 关键上下文：Govern；Manage
    - OWASP AI Agent Security Cheat Sheet
    - 链接：https://cheatsheetseries.owasp.org/cheatsheets/AI_Agent_Security_Cheat_Sheet.html
    - 关键上下文：Human-in-the-Loop Controls；Monitoring and Logging
    detection:
      type: require_pattern
      include_globs: *id002
      patterns:
      - confirm
      - approval
      - Are you sure
      - user_confirm
      pass_if: match_found
      reason: 必须发现控制证据才判定通过
    pass_condition: match_found
    on_fail:
      action: require_review
      reason: 未通过静态规则：检查是否对不可逆高影响操作缺少显式确认
  - id: S2-03-004
    item: 检查是否对高影响操作缺少回滚或取消能力
    stage: 设计阶段
    risk_personal: /
    risk_nonpersonal: 低
    detection_target: 检测“检查是否对高影响操作缺少回滚或取消能力”是否在技能实现、配置或说明文档中真实存在，重点核查 高危操作逻辑。
    detection_method: 静态检查为主，结合人工复核。原因：该类风险通常具有明确代码、脚本或配置特征，适合通过静态扫描、模式匹配和上下文复核判断。
    verification_steps:
    - 1. 人工检查 高危操作逻辑，确认是否存在与“检查是否对高影响操作缺少回滚或取消能力”对应的实现入口、配置项或文档描述。
    - 2. 用代码搜索定位高风险函数、命令、路径、网络目标或依赖声明，并结合上下文复核是否可被外部输入触发。
    - 3. 通过静态代码路径、配置约束和文档声明复核，确认“执行后无法撤销，风险不可控”是否能够真实发生，并记录触发条件、影响范围和阻断点。
    fix_suggestion: 增加回滚接口、超时自动取消。同时补充最小权限、输入校验、可观测性和默认拒绝策略。
    source_context:
    - NIST AI Risk Management Framework
    - 链接：https://www.nist.gov/itl/ai-risk-management-framework
    - 关键上下文：Govern；Manage
    - OWASP AI Agent Security Cheat Sheet
    - 链接：https://cheatsheetseries.owasp.org/cheatsheets/AI_Agent_Security_Cheat_Sheet.html
    - 关键上下文：Human-in-the-Loop Controls；Monitoring and Logging
    detection:
      type: require_pattern
      include_globs: *id002
      patterns:
      - rollback
      - undo
      - cancel
      - revert
      pass_if: match_found
      reason: 必须发现控制证据才判定通过
    pass_condition: match_found
    on_fail:
