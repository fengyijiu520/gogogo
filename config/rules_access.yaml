- id: S2-G13
  category: 基础安全实现类
  enforcement_mapping:
    high: block
    medium: require_review
    low: record_and_pass
  items:
  - id: S2-13-001
    item: 检查是否使用可预测随机值生成安全凭据
    stage: 设计阶段
    risk_personal: /
    risk_nonpersonal: 低
    detection_target: 检测“检查是否使用可预测随机值生成安全凭据”是否在技能实现、配置或说明文档中真实存在，重点核查 随机数生成。
    detection_method: 静态检查为主，结合人工复核。原因：该类风险通常具有明确代码、脚本或配置特征，适合通过静态扫描、模式匹配和上下文复核判断。
    verification_steps:
    - 1. 人工检查 随机数生成，确认是否存在与“检查是否使用可预测随机值生成安全凭据”对应的实现入口、配置项或文档描述。
    - 2. 用代码搜索定位高风险函数、命令、路径、网络目标或依赖声明，并结合上下文复核是否可被外部输入触发。
    - 3. 通过静态代码路径、配置约束和文档声明复核，确认“随机数可预测，破坏安全逻辑”是否能够真实发生，并记录触发条件、影响范围和阻断点。
    fix_suggestion: 使用密码学安全随机数。同时补充最小权限、输入校验、可观测性和默认拒绝策略。
    source_context:
    - OWASP Cryptographic Storage Cheat Sheet
    - 链接：https://cheatsheetseries.owasp.org/cheatsheets/Cryptographic_Storage_Cheat_Sheet.html
    - 关键上下文：Randomness Requirements
    - MITRE CWE-330 Use of Insufficiently Random Values
    - 链接：https://cwe.mitre.org/data/definitions/330.html
    - 关键上下文：Description；Potential Mitigations
    detection:
      type: forbid_pattern
      include_globs: *id001
      patterns:
      - random\.seed
      - rand\(
      - Math\.random
      pass_if: no_match
      reason: 发现禁用模式即判定未通过
    pass_condition: no_match
    on_fail:
      action: require_review
      reason: 未通过静态规则：检查是否使用可预测随机值生成安全凭据
