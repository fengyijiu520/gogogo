    - 2. 用代码搜索定位高风险函数、命令、路径、网络目标或依赖声明，并结合上下文复核是否可被外部输入触发。
    - 3. 通过静态代码路径、配置约束和文档声明复核，确认“输出密钥/系统提示词/内部路径等敏感信息”是否能够真实发生，并记录触发条件、影响范围和阻断点。
