      reason: 未通过静态规则：检查是否对高影响操作缺少回滚或取消能力
  - id: S2-03-005
    item: 检查是否在日志中明文记录凭据
    stage: 设计阶段
    risk_personal: /
    risk_nonpersonal: 低
    detection_target: 检测“检查是否在日志中明文记录凭据”是否在技能实现、配置或说明文档中真实存在，重点核查 日志、调试打印。
    detection_method: 静态检查为主，结合人工复核。原因：该类风险通常具有明确代码、脚本或配置特征，适合通过静态扫描、模式匹配和上下文复核判断。
    verification_steps:
    - 1. 人工检查 日志、调试打印，确认是否存在与“检查是否在日志中明文记录凭据”对应的实现入口、配置项或文档描述。
    - 2. 用代码搜索定位高风险函数、命令、路径、网络目标或依赖声明，并结合上下文复核是否可被外部输入触发。
    - 3. 通过静态代码路径、配置约束和文档声明复核，确认“明文记录密码/Token，极易泄露”是否能够真实发生，并记录触发条件、影响范围和阻断点。
    fix_suggestion: 敏感字段脱敏，禁止明文输出。同时补充最小权限、输入校验、可观测性和默认拒绝策略。
    source_context:
    - NIST AI Risk Management Framework
    - 链接：https://www.nist.gov/itl/ai-risk-management-framework
    - 关键上下文：Govern；Manage
    - OWASP AI Agent Security Cheat Sheet
    - 链接：https://cheatsheetseries.owasp.org/cheatsheets/AI_Agent_Security_Cheat_Sheet.html
    - 关键上下文：Human-in-the-Loop Controls；Monitoring and Logging
    detection:
      type: forbid_pattern
      include_globs: *id001
      patterns:
      - logger\..+password
      - logger\..+token
      - console\.log\(.+secret
      - print\(.+apikey
      pass_if: no_match
      reason: 发现禁用模式即判定未通过
    pass_condition: no_match
    on_fail:
      action: require_review
      reason: 未通过静态规则：检查是否在日志中明文记录凭据
  - id: S2-03-006
    item: 检查是否缺少关键安全事件审计
    stage: 设计阶段
    risk_personal: /
    risk_nonpersonal: 低
    detection_target: 检测“检查是否缺少关键安全事件审计”是否在技能实现、配置或说明文档中真实存在，重点核查 权限/外联/文件/命令操作。
    detection_method: 静态分析+人工复核。原因：该类风险需要结合文档、配置、数据流和执行路径综合判断，单一模式匹配覆盖不足。
    verification_steps:
    - 1. 人工检查 权限/外联/文件/命令操作，确认是否存在与“检查是否缺少关键安全事件审计”对应的实现入口、配置项或文档描述。
    - 2. 用代码搜索定位高风险函数、命令、路径、网络目标或依赖声明，并结合上下文复核是否可被外部输入触发。
    - 3. 通过静态代码路径、配置约束和文档声明复核，确认“无审计日志，出事无法追溯”是否能够真实发生，并记录触发条件、影响范围和阻断点。
    fix_suggestion: 补充完整审计字段：操作人、时间、结果。同时补充最小权限、输入校验、可观测性和默认拒绝策略。
    source_context:
    - NIST AI Risk Management Framework
    - 链接：https://www.nist.gov/itl/ai-risk-management-framework
    - 关键上下文：Govern；Manage
    - OWASP AI Agent Security Cheat Sheet
    - 链接：https://cheatsheetseries.owasp.org/cheatsheets/AI_Agent_Security_Cheat_Sheet.html
    - 关键上下文：Human-in-the-Loop Controls；Monitoring and Logging
    detection:
      type: require_pattern
      include_globs: *id002
      patterns:
      - audit
      - trace[_-]?id
      - security[_-]?event
      - operation[_-]?log
      pass_if: match_found
      reason: 必须发现控制证据才判定通过
    pass_condition: match_found
    on_fail:
      action: require_review
      reason: 未通过静态规则：检查是否缺少关键安全事件审计
- id: S2-G04
  category: 权限与访问控制类
  enforcement_mapping:
    high: block
    medium: require_review
    low: record_and_pass
  items:
  - id: S2-04-001
    item: 检查是否调用提权或沙箱逃逸相关系统接口
    stage: 设计阶段
    risk_personal: 高
    risk_nonpersonal: 高
    detection_target: 检测“检查是否调用提权或沙箱逃逸相关系统接口”是否在技能实现、配置或说明文档中真实存在，重点核查 系统调用/权限提升代码。
    detection_method: 静态检查为主，结合人工复核。原因：该类风险通常具有明确代码、脚本或配置特征，适合通过静态扫描、模式匹配和上下文复核判断。
    verification_steps:
    - 1. 人工检查 系统调用/权限提升代码，确认是否存在与“检查是否调用提权或沙箱逃逸相关系统接口”对应的实现入口、配置项或文档描述。
    - 2. 用代码搜索定位高风险函数、命令、路径、网络目标或依赖声明，并结合上下文复核是否可被外部输入触发。
    - 3. 通过静态代码路径、配置约束和文档声明复核，确认“可突破沙箱限制，访问宿主机资源”是否能够真实发生，并记录触发条件、影响范围和阻断点。
    fix_suggestion: 移除逃逸/提权逻辑，遵循沙箱约束。同时补充最小权限、输入校验、可观测性和默认拒绝策略。
    source_context:
    - OWASP AI Agent Security Cheat Sheet
    - 链接：https://cheatsheetseries.owasp.org/cheatsheets/AI_Agent_Security_Cheat_Sheet.html
    - 关键上下文：Tool Security & Least Privilege
    - MITRE CWE Catalog
    - 链接：https://cwe.mitre.org/
    - 关键上下文：Path Traversal；Improper Authorization；Hidden Functionality
    detection:
      type: forbid_pattern
      include_globs: *id001
      patterns:
      - ptrace
      - unshare
      - capset
      - setuid\(
      - docker\.sock
      - /proc/self/ns
      pass_if: no_match
      reason: 发现禁用模式即判定未通过
    pass_condition: no_match
    on_fail:
      action: block
      reason: 未通过静态规则：检查是否调用提权或沙箱逃逸相关系统接口
  - id: S2-04-002
    item: 检查是否访问宿主机敏感路径
    stage: 设计阶段
    risk_personal: 高
    risk_nonpersonal: 高
    detection_target: 检测“检查是否访问宿主机敏感路径”是否在技能实现、配置或说明文档中真实存在，重点核查 文件系统访问代码。
    detection_method: 静态检查为主，结合人工复核。原因：该类风险通常具有明确代码、脚本或配置特征，适合通过静态扫描、模式匹配和上下文复核判断。
    verification_steps:
    - 1. 人工检查 文件系统访问代码，确认是否存在与“检查是否访问宿主机敏感路径”对应的实现入口、配置项或文档描述。
    - 2. 用代码搜索定位高风险函数、命令、路径、网络目标或依赖声明，并结合上下文复核是否可被外部输入触发。
    - 3. 通过静态代码路径、配置约束和文档声明复核，确认“直接读取宿主机敏感文件，逃逸沙箱”是否能够真实发生，并记录触发条件、影响范围和阻断点。
    fix_suggestion: 禁止访问宿主路径，仅开放工作区。同时补充最小权限、输入校验、可观测性和默认拒绝策略。
    source_context:
    - OWASP AI Agent Security Cheat Sheet
    - 链接：https://cheatsheetseries.owasp.org/cheatsheets/AI_Agent_Security_Cheat_Sheet.html
    - 关键上下文：Tool Security & Least Privilege
    - MITRE CWE Catalog
    - 链接：https://cwe.mitre.org/
    - 关键上下文：Path Traversal；Improper Authorization；Hidden Functionality
    detection:
      type: forbid_pattern
      include_globs: *id001
      patterns:
      - /etc/
      - /root/
      - /var/run/docker.sock
      - /proc/
      - C:\\Windows
      pass_if: no_match
      reason: 发现禁用模式即判定未通过
    pass_condition: no_match
    on_fail:
      action: block
      reason: 未通过静态规则：检查是否访问宿主机敏感路径
  - id: S2-04-003
    item: 检查是否允许通过相对路径穿越访问越界文件
    stage: 设计阶段
    risk_personal: /
    risk_nonpersonal: 低
    detection_target: 检测“检查是否允许通过相对路径穿越访问越界文件”是否在技能实现、配置或说明文档中真实存在，重点核查 文件路径拼接/读写代码。
    detection_method: 静态检查为主，结合人工复核。原因：该类风险通常具有明确代码、脚本或配置特征，适合通过静态扫描、模式匹配和上下文复核判断。
    verification_steps:
    - 1. 人工检查 文件路径拼接/读写代码，确认是否存在与“检查是否允许通过相对路径穿越访问越界文件”对应的实现入口、配置项或文档描述。
    - 2. 用代码搜索定位高风险函数、命令、路径、网络目标或依赖声明，并结合上下文复核是否可被外部输入触发。
    - 3. 通过静态代码路径、配置约束和文档声明复核，确认“可通过../穿越目录，访问工作区外敏感文件”是否能够真实发生，并记录触发条件、影响范围和阻断点。
    fix_suggestion: 路径规范化，强制根目录边界校验。同时补充最小权限、输入校验、可观测性和默认拒绝策略。
    source_context:
    - OWASP AI Agent Security Cheat Sheet
    - 链接：https://cheatsheetseries.owasp.org/cheatsheets/AI_Agent_Security_Cheat_Sheet.html
    - 关键上下文：Tool Security & Least Privilege
    - MITRE CWE Catalog
    - 链接：https://cwe.mitre.org/
    - 关键上下文：Path Traversal；Improper Authorization；Hidden Functionality
    detection:
      type: forbid_pattern
      include_globs: *id001
      patterns:
      - \.\./
      - \.\\\.\\
      - path\.join\(.+input
      pass_if: no_match
      reason: 发现相对路径穿越危险信号且缺少路径规范化与根目录约束控制时判定未通过
      control_include_globs: *id001
      control_patterns:
      - filepath.Clean
      - path.Clean
      - normalize
      - canonical
      - getCanonicalPath
      - realpath
      - Path.GetFullPath
      - startswith
      - startsWith
      - rootDir
      - baseDir
      - allowlist
      match_logic: danger_without_control
      fail_when: danger_match_and_control_missing
      danger_patterns:
      - \.\./
      - \.\\\.\\
      - path\.join\(.+input
    pass_condition: no_danger_match_or_control_match
    on_fail:
      action: require_review
      reason: 未通过静态规则：检查是否允许通过相对路径穿越访问越界文件
  - id: S2-04-004
    item: 检查是否允许通过绝对路径访问越界文件
    stage: 设计阶段
    risk_personal: 高
    risk_nonpersonal: 低
    detection_target: 检测“检查是否允许通过绝对路径访问越界文件”是否在技能实现、配置或说明文档中真实存在，重点核查 文件访问代码。
    detection_method: 静态检查为主，结合人工复核。原因：该类风险通常具有明确代码、脚本或配置特征，适合通过静态扫描、模式匹配和上下文复核判断。
    verification_steps:
    - 1. 人工检查 文件访问代码，确认是否存在与“检查是否允许通过绝对路径访问越界文件”对应的实现入口、配置项或文档描述。
    - 2. 用代码搜索定位高风险函数、命令、路径、网络目标或依赖声明，并结合上下文复核是否可被外部输入触发。
    - 3. 通过静态代码路径、配置约束和文档声明复核，确认“允许绝对路径，直接访问系统文件”是否能够真实发生，并记录触发条件、影响范围和阻断点。
    fix_suggestion: 禁止绝对路径，限定在工作目录内。同时补充最小权限、输入校验、可观测性和默认拒绝策略。
    source_context:
    - OWASP AI Agent Security Cheat Sheet
    - 链接：https://cheatsheetseries.owasp.org/cheatsheets/AI_Agent_Security_Cheat_Sheet.html
    - 关键上下文：Tool Security & Least Privilege
    - MITRE CWE Catalog
    - 链接：https://cwe.mitre.org/
    - 关键上下文：Path Traversal；Improper Authorization；Hidden Functionality
    detection:
      type: forbid_pattern
      include_globs: *id001
      patterns:
      - (^|["\'])/
      - '[A-Za-z]:\\'
      pass_if: no_match
      reason: 发现绝对路径越界危险信号且缺少根目录限制与路径校验控制时判定未通过
      control_include_globs: *id001
      control_patterns:
      - startswith
      - startsWith
      - rootDir
      - baseDir
      - allowedPaths
      - path whitelist
      - sandbox
      - realpath
      - getCanonicalPath
      - Path.GetFullPath
      match_logic: danger_without_control
      fail_when: danger_match_and_control_missing
      danger_patterns:
      - (^|["\'])/
      - '[A-Za-z]:\\'
    pass_condition: no_danger_match_or_control_match
    on_fail:
      action: require_review
      reason: 未通过静态规则：检查是否允许通过绝对路径访问越界文件
  - id: S2-04-005
    item: 检查是否存在 许可证校验逻辑不闭环
    stage: 设计阶段
    risk_personal: /
    risk_nonpersonal: 高
    detection_target: 检测“检查是否存在 许可证校验逻辑不闭环”是否在技能实现、配置或说明文档中真实存在，重点核查 授权校验逻辑（try-except/状态码判断/返回体校验/默认返回）。
    detection_method: 静态分析+人工复核。原因：该类风险需要结合文档、配置、数据流和执行路径综合判断，单一模式匹配覆盖不足。
    verification_steps:
    - 1. 人工检查 授权校验逻辑（try-except/状态码判断/返回体校验/默认返回），确认是否存在与“检查是否存在 许可证校验逻辑不闭环”对应的实现入口、配置项或文档描述。
    - 2. 用代码搜索定位高风险函数、命令、路径、网络目标或依赖声明，并结合上下文复核是否可被外部输入触发。
    - 3. 通过静态代码路径、配置约束和文档声明复核，确认“许可证校验采用 Fail-Open：异常吞掉、仅判断 200、不校验 valid、无默认拒绝，可绕过授权免费使用付费能力”是否能够真实发生，并记录触发条件、影响范围和阻断点。
    fix_suggestion: 采用 Fail-Closed：1) 捕获异常并拒绝；2) 校验 HTTP 200 且返回体 valid=true；3) 函数末尾默认返回 false。同时补充最小权限、输入校验、可观测性和默认拒绝策略。
    source_context:
    - OWASP AI Agent Security Cheat Sheet
    - 链接：https://cheatsheetseries.owasp.org/cheatsheets/AI_Agent_Security_Cheat_Sheet.html
    - 关键上下文：Tool Security & Least Privilege
    - MITRE CWE Catalog
    - 链接：https://cwe.mitre.org/
    - 关键上下文：Path Traversal；Improper Authorization；Hidden Functionality
    detection:
      type: forbid_pattern
      include_globs: *id001
      patterns:
      - except:\s*pass
      - return\s+true
      - status_code\s*==\s*200
      - valid\s*\|\|\s*true
      pass_if: no_match
      reason: 发现禁用模式即判定未通过
    pass_condition: no_match
    on_fail:
      action: block
      reason: 未通过静态规则：检查是否存在 许可证校验逻辑不闭环
- id: S2-G05
  category: 供应链安全类
  enforcement_mapping:
    high: block
    medium: require_review
    low: record_and_pass
  items:
  - id: S2-05-001
    item: 检查是否引入存在已知高危远程执行漏洞的依赖
    stage: 设计阶段
    risk_personal: 高
    risk_nonpersonal: 中
    detection_target: 检测依赖清单中是否包含存在已知高危远程执行漏洞的依赖，重点核查依赖版本、锁文件和漏洞公告。
    detection_method: 依赖清单分析+漏洞信息复核。原因：该问题核心是版本与公开漏洞情报的匹配关系，需要结合依赖清单和漏洞资料判断。
    verification_steps:
    - 1. 读取依赖清单和锁文件，列出实际引入版本。
    - 2. 对照漏洞数据库或公告，确认是否存在已知高危远程执行漏洞。
    - 3. 复核漏洞影响范围，确认该依赖是否在技能实际运行路径中可达。
    fix_suggestion: 升级到无已知高危漏洞的版本，并通过锁版本和漏洞扫描阻止回退。
    source_context:
    - OpenSSF Secure Supply Chain Consumption Framework
    - 链接：https://openssf.org/community/specifications/
    - 关键上下文：依赖来源可信、版本固定、完整性验证
    - OWASP Software Supply Chain Security Cheat Sheet
    - 链接：https://cheatsheetseries.owasp.org/cheatsheets/Software_Supply_Chain_Security_Cheat_Sheet.html
    - 关键上下文：Dependency Pinning；Artifact Integrity；Trusted Sources
    detection:
      type: require_pattern
      include_globs:
      - '**/*'
      patterns:
      - package-lock\.json
      - pnpm-lock\.yaml
      - yarn\.lock
      - requirements\.txt
      - go\.sum
      pass_if: match_found
      reason: 必须发现控制证据才判定通过
    pass_condition: match_found
    on_fail:
      action: require_review
      reason: 未通过静态规则：检查是否引入存在已知高危远程执行漏洞的依赖
  - id: S2-05-002
    item: 检查是否引入存在已知高危数据泄露漏洞的依赖
    stage: 设计阶段
    risk_personal: /
    risk_nonpersonal: 中
    detection_target: 检测依赖清单中是否包含存在已知高危数据泄露漏洞的依赖，重点核查依赖版本、锁文件和漏洞公告。
    detection_method: 依赖清单分析+漏洞信息复核。原因：需要把实际依赖版本与已知漏洞情报逐项比对，才能确认真实风险。
    verification_steps:
    - 1. 读取依赖清单和锁文件，列出实际引入版本。
    - 2. 对照漏洞数据库或公告，确认是否存在已知高危数据泄露漏洞。
    - 3. 复核漏洞影响范围，确认该依赖是否在技能数据处理路径中可达。
    fix_suggestion: 升级到无已知高危漏洞的版本，并通过锁版本和漏洞扫描阻止回退。
    source_context:
    - OpenSSF Secure Supply Chain Consumption Framework
    - 链接：https://openssf.org/community/specifications/
    - 关键上下文：依赖来源可信、版本固定、完整性验证
    - OWASP Software Supply Chain Security Cheat Sheet
    - 链接：https://cheatsheetseries.owasp.org/cheatsheets/Software_Supply_Chain_Security_Cheat_Sheet.html
    - 关键上下文：Dependency Pinning；Artifact Integrity；Trusted Sources
    detection:
      type: require_pattern
      include_globs:
      - '**/*'
      patterns:
      - package-lock\.json
      - pnpm-lock\.yaml
      - yarn\.lock
      - requirements\.txt
      - go\.sum
      pass_if: match_found
      reason: 必须发现控制证据才判定通过
    pass_condition: match_found
    on_fail:
      action: require_review
      reason: 未通过静态规则：检查是否引入存在已知高危数据泄露漏洞的依赖
  - id: S2-05-003
    item: 检查是否引入疑似拼写劫持依赖包
    stage: 设计阶段
    risk_personal: /
    risk_nonpersonal: 中
    detection_target: 检测依赖名称中是否存在疑似拼写劫持包，重点核查包名相似性、来源仓库和维护者信息。
    detection_method: 依赖名称审查+来源复核。原因：拼写劫持主要依赖名称近似和来源伪装，需要结合包名与来源一起判断。
    verification_steps:
    - 1. 列出全部依赖包名，检查是否与常见官方包存在高相似拼写。
    - 2. 核对包的来源地址、发布主体和下载渠道是否与官方信息一致。
    - 3. 对高相似包进行人工复核，确认是否属于误拼或投毒包。
    fix_suggestion: 替换为官方包名，并在源侧启用包名审核和私有镜像。
    source_context:
    - OpenSSF Secure Supply Chain Consumption Framework
    - 链接：https://openssf.org/community/specifications/
    - 关键上下文：依赖来源可信、版本固定、完整性验证
    - OWASP Software Supply Chain Security Cheat Sheet
    - 链接：https://cheatsheetseries.owasp.org/cheatsheets/Software_Supply_Chain_Security_Cheat_Sheet.html
    - 关键上下文：Dependency Pinning；Artifact Integrity；Trusted Sources
    detection:
      type: forbid_pattern
      include_globs: *id001
      patterns:
      - req[u]?ests[s]?
      - numppy
      - urlib3
      - colourama
      - pyto[rn]ch
      pass_if: no_match
      reason: 发现禁用模式即判定未通过
    pass_condition: no_match
    on_fail:
      action: require_review
      reason: 未通过静态规则：检查是否引入疑似拼写劫持依赖包
  - id: S2-05-004
    item: 检查是否引入来源异常或维护者异常的依赖包
    stage: 设计阶段
    risk_personal: /
    risk_nonpersonal: 中
    detection_target: 检测依赖来源或维护者信息是否异常，重点核查来源地址、维护者变更、发布时间和发布渠道。
    detection_method: 来源审查+维护者异常复核。原因：该问题主要体现在来源与发布主体异常，需要人工结合发布背景确认。
    verification_steps:
    - 1. 检查依赖包来源地址、发布仓库和维护者信息。
    - 2. 关注近期维护者异常变更、突然发布或来源漂移等信号。
    - 3. 对异常依赖做人工复核，确认是否需要替换或锁定。
    fix_suggestion: 审核维护者、来源和发布时间异常信号，仅保留可信依赖。
    source_context:
    - OpenSSF Secure Supply Chain Consumption Framework
    - 链接：https://openssf.org/community/specifications/
    - 关键上下文：依赖来源可信、版本固定、完整性验证
    - OWASP Software Supply Chain Security Cheat Sheet
    - 链接：https://cheatsheetseries.owasp.org/cheatsheets/Software_Supply_Chain_Security_Cheat_Sheet.html
    - 关键上下文：Dependency Pinning；Artifact Integrity；Trusted Sources
    detection:
      type: forbid_pattern
      include_globs: *id001
      patterns:
      - github\.com/.+/.+/(archive|releases)/.+\.(zip|tar\.gz)
      - git\+http
      - raw\.githubusercontent\.com
      pass_if: no_match
      reason: 发现禁用模式即判定未通过
    pass_condition: no_match
    on_fail:
      action: require_review
      reason: 未通过静态规则：检查是否引入来源异常或维护者异常的依赖包
  - id: S2-05-005
    item: 检查是否使用通配符版本导致依赖漂移
    stage: 设计阶段
    risk_personal: /
    risk_nonpersonal: 中
    detection_target: 检测依赖声明中是否使用通配符版本，重点核查 package、requirements 或 lockfile 对应定义。
    detection_method: 静态检查为主。原因：该问题直接体现在依赖声明语法上，通过静态检查即可准确判断。
    verification_steps:
    - 1. 检查依赖声明文件中是否使用 *、latest 等通配符版本。
    - 2. 复核这些声明是否会导致安装结果随时间变化。
    - 3. 验证是否存在锁文件或其他机制固定最终版本。
    fix_suggestion: 改为精确版本并提交锁文件，确保构建结果可复现。
    source_context:
    - OpenSSF Secure Supply Chain Consumption Framework
    - 链接：https://openssf.org/community/specifications/
    - 关键上下文：依赖来源可信、版本固定、完整性验证
    - OWASP Software Supply Chain Security Cheat Sheet
    - 链接：https://cheatsheetseries.owasp.org/cheatsheets/Software_Supply_Chain_Security_Cheat_Sheet.html
    - 关键上下文：Dependency Pinning；Artifact Integrity；Trusted Sources
    detection:
      type: forbid_pattern
      include_globs:
      - '**/package.json'
      - '**/package-lock.json'
      - '**/pnpm-lock.yaml'
      - '**/requirements*.txt'
      - '**/pyproject.toml'
      patterns:
      - \*
      - latest
      - \^\d
      - ~\d
      pass_if: no_match
      reason: 发现禁用模式即判定未通过
    pass_condition: no_match
    on_fail:
      action: require_review
      reason: 未通过静态规则：检查是否使用通配符版本导致依赖漂移
  - id: S2-05-006
    item: 检查是否使用范围版本导致构建结果不稳定
    stage: 设计阶段
    risk_personal: /
    risk_nonpersonal: 中
    detection_target: 检测依赖声明中是否使用范围版本，重点核查 semver 范围表达式和最终安装结果。
    detection_method: 静态检查为主。原因：范围版本风险主要来自声明方式和构建结果漂移，静态检查最直接。
    verification_steps:
    - 1. 检查依赖声明是否使用 >、>=、^、~ 等范围版本表达式。
    - 2. 复核这些范围是否会导致不同时间构建出不同依赖版本。
    - 3. 检查是否有锁文件或发布流程固定最终产物。
    fix_suggestion: 改为精确版本并提交锁文件，确保构建结果可复现。
    source_context:
    - OpenSSF Secure Supply Chain Consumption Framework
    - 链接：https://openssf.org/community/specifications/
    - 关键上下文：依赖来源可信、版本固定、完整性验证
    - OWASP Software Supply Chain Security Cheat Sheet
    - 链接：https://cheatsheetseries.owasp.org/cheatsheets/Software_Supply_Chain_Security_Cheat_Sheet.html
    - 关键上下文：Dependency Pinning；Artifact Integrity；Trusted Sources
    detection:
      type: forbid_pattern
      include_globs:
      - '**/package.json'
      - '**/requirements*.txt'
      - '**/pyproject.toml'
      patterns:
      - \^\d
      - ~\d
      - '>=?\s*\d'
      pass_if: no_match
      reason: 发现禁用模式即判定未通过
    pass_condition: no_match
    on_fail:
      action: require_review
      reason: 未通过静态规则：检查是否使用范围版本导致构建结果不稳定
  - id: S2-05-007
    item: 检查技能发布包与审查源码版本是否一致
    stage: 设计阶段
    risk_personal: 高
    risk_nonpersonal: 中
    detection_target: 检测进入技能仓库的发布包是否与被审查源码版本、构建结果和版本标识一致，重点核查发布物、源码提交、版本号和构建产物映射关系。
    detection_method: 静态分析+构建产物比对。原因：该问题核心在于审查对象、版本标识和最终交付物是否一致，需要通过源码、构建结果、版本信息和发布包内容进行逐项比对确认。
    verification_steps:
    - 1. 提取发布包版本号、提交号、构建时间和产物清单，与送审源码和构建记录逐项比对。
    - 2. 检查发布包中文件清单、哈希和关键脚本是否与审查时的构建结果一致。
    - 3. 在隔离环境重新构建同版本源码，比较生成产物与入库发布包是否存在差异，并记录差异来源。
    fix_suggestion: 为技能发布流程建立源码版本、构建产物、发布包三者的强绑定校验；入库前强制校验版本号、提交号和关键文件哈希一致。
    source_context:
    - OWASP Software Supply Chain Security Cheat Sheet
    - 链接：https://cheatsheetseries.owasp.org/cheatsheets/Software_Supply_Chain_Security_Cheat_Sheet.html
    - 关键上下文：Verify Provenance；Release Integrity；Artifact Traceability
    - SLSA
    - 链接：https://slsa.dev/
    - 关键上下文：Source to Artifact Provenance；Build Integrity
    detection:
      type: require_pattern
      include_globs:
      - '**/*.md'
      - SKILL.md
      - README*
      - docs/**/*.md
      - '**/*.yaml'
      - '**/*.yml'
      - '**/*.json'
      - '**/package.json'
      - '**/pyproject.toml'
      - '**/setup.py'
      patterns:
      - version
      - tag
      - commit
      pass_if: match_found
      reason: 必须发现控制证据才判定通过
    pass_condition: match_found
    on_fail:
      action: require_review
      reason: 未通过静态规则：检查技能发布包与审查源码版本是否一致
  - id: S2-05-008
    item: 检查技能交付物是否包含未声明的预编译文件、脚本或二进制
    stage: 设计阶段
    risk_personal: 高
    risk_nonpersonal: 中
    detection_target: 检测技能交付物中是否存在未在声明、源码或交付说明中披露的预编译文件、脚本或二进制，重点核查压缩包内容、可执行文件和构建输出目录。
    detection_method: 静态清单审查+交付物内容检查。原因：该问题关键在于交付物实际包含了什么内容、是否超出声明范围，最有效的方法是直接审查包内容、文件类型和可执行成分。
    verification_steps:
    - 1. 解包技能交付物，列出全部文件类型、目录结构和可执行成分，识别脚本、二进制、动态库和预编译产物。
    - 2. 将交付物清单与技能说明、源码目录和构建输出清单逐项比对，确认是否存在未声明文件。
    - 3. 对未声明的可执行内容检查其来源、用途和触发路径，必要时通过静态扫描与配置复核确认是否会被自动加载或执行。
    fix_suggestion: 为技能交付物建立允许文件类型和允许制品清单；未声明的脚本、二进制和预编译文件默认禁止入库，确需保留时必须补充声明和用途说明。
    source_context:
    - OWASP Software Supply Chain Security Cheat Sheet
    - 链接：https://cheatsheetseries.owasp.org/cheatsheets/Software_Supply_Chain_Security_Cheat_Sheet.html
    - 关键上下文：Artifact Integrity；Package Review；Build and Release Controls
    - OWASP AI Agent Security Cheat Sheet
    - 链接：https://cheatsheetseries.owasp.org/cheatsheets/AI_Agent_Security_Cheat_Sheet.html
    - 关键上下文：Tool Security & Least Privilege；Monitoring and Logging
    detection:
      type: artifact_vs_docs
      include_globs:
      - '**/*.zip'
      - '**/*.tar'
      - '**/*.tgz'
      - '**/*.tar.gz'
      - '**/*.whl'
      - '**/*.jar'
      - '**/*.nupkg'
      - '**/*.vsix'
      - dist/**/*
      - release/**/*
      - build/**/*
      - '**/*'
      artifact_include_globs:
      - '**/*.zip'
      - '**/*.tar'
      - '**/*.tgz'
      - '**/*.tar.gz'
      - '**/*.whl'
      - '**/*.jar'
      - '**/*.nupkg'
      - '**/*.vsix'
      - dist/**/*
      - release/**/*
      - build/**/*
      - '**/*'
      artifact_patterns:
      - \.so$
      - \.dll$
      - \.exe$
      - \.bin$
      - \.class$
      - \.jar$
      - \.pyc$
      - \.node$
      doc_globs: *id003
      doc_include_globs: *id003
      doc_patterns:
      - 二进制
      - 预编译
      - compiled
      - artifact
      - 发布包
      pass_if: no_artifact_match_or_doc_match
      reason: 发现预编译或二进制交付物时，文档或清单中必须有声明
    pass_condition: no_artifact_match_or_doc_match
    on_fail:
      action: require_review
      reason: 未通过静态规则：检查技能交付物是否包含未声明的预编译文件、脚本或二进制
  - id: S2-05-009
    item: 检查是否缺少可追溯的依赖 SBOM 清单
    stage: 设计阶段
    risk_personal: /
    risk_nonpersonal: 低
    detection_target: 检测技能交付物是否附带可追溯的依赖 SBOM 清单，重点核查项目根目录、发布物和交付说明。
    detection_method: 静态清单审查+发布物比对。原因：该问题重点在交付物是否提供可追溯依赖信息，需要直接检查交付清单。
    verification_steps:
    - 1. 检查项目根目录或发布物中是否存在 SBOM 文件。
    - 2. 复核 SBOM 是否覆盖主要依赖、版本和来源信息。
    - 3. 验证 SBOM 是否与当前发布版本和实际依赖清单一致。
    fix_suggestion: 生成并随发布物保存 SBOM，用于追踪依赖来源和漏洞影响面。
    source_context:
    - OpenSSF Secure Supply Chain Consumption Framework
    - 链接：https://openssf.org/community/ssc-framework/
    - 关键上下文：Inventory Dependencies；Track Component Origins；Verify Artifact Metadata
    - OWASP Software Supply Chain Security Cheat Sheet
    - 链接：https://cheatsheetseries.owasp.org/cheatsheets/Software_Supply_Chain_Security_Cheat_Sheet.html
    - 关键上下文：Software Bill of Materials；Dependency Inventory
    detection:
      type: require_file_presence
      required_files:
      - SBOM
      - sbom.json
      - cyclonedx
      - spdx
      include_globs:
      - '**/*'
      patterns:
      - SBOM
      - sbom\.json
      - cyclonedx
      - spdx
      pass_if: match_found
      reason: 必须发现文件或制品证据才判定通过
    pass_condition: match_found
    on_fail:
      action: require_review
      reason: 未通过静态规则：检查是否缺少可追溯的依赖 SBOM 清单
  - id: S2-05-010
    item: 检查是否缺少可复现构建所需的依赖锁文件
    stage: 设计阶段
    risk_personal: /
    risk_nonpersonal: 低
    detection_target: 检测技能项目是否提供可复现构建所需的依赖锁文件，重点核查项目根目录和发布说明。
    detection_method: 静态检查+配置一致性复核。原因：该问题同时涉及锁文件存在性和依赖声明约束，应通过静态文件与配置检查确认。
    verification_steps:
    - 1. 检查项目根目录中是否存在 lockfile 或等效锁定文件。
    - 2. 复核锁文件是否与依赖声明和当前发布版本匹配。
    - 3. 验证在隔离环境重装依赖时是否可得到一致结果。
    fix_suggestion: 提交锁文件并纳入 CI 校验，保证环境间安装结果一致。
    source_context:
    - OpenSSF Secure Supply Chain Consumption Framework
    - 链接：https://openssf.org/community/ssc-framework/
    - 关键上下文：Pin and Verify Dependencies；Reproducible Consumption Controls
    - OWASP Software Supply Chain Security Cheat Sheet
    - 链接：https://cheatsheetseries.owasp.org/cheatsheets/Software_Supply_Chain_Security_Cheat_Sheet.html
    - 关键上下文：Dependency Pinning；Reproducible Builds
    detection:
      type: require_file_presence
      required_files:
      - package-lock.json
      - pnpm-lock.yaml
      - yarn.lock
      - poetry.lock
      - go.sum
      include_globs:
      - '**/*'
      patterns:
      - package-lock\.json
      - pnpm-lock\.yaml
      - yarn\.lock
      - poetry\.lock
      - go\.sum
      pass_if: match_found
      reason: 必须发现文件或制品证据才判定通过
    pass_condition: match_found
    on_fail:
      action: require_review
      reason: 未通过静态规则：检查是否缺少可复现构建所需的依赖锁文件
  - id: S2-05-011
    item: 检查是否从未经审核的第三方源下载依赖
    stage: 设计阶段
    risk_personal: 高
    risk_nonpersonal: 中
    detection_target: 检测技能是否从未经审核的第三方源下载依赖，重点核查依赖源配置、镜像地址和安装脚本。
    detection_method: 静态检查+来源配置复核+隔离验证。原因：该问题取决于配置声明和真实安装行为，二者都需要确认。
    verification_steps:
    - 1. 检查包管理器配置、镜像地址和安装脚本中使用的依赖源。
    - 2. 识别是否存在未经审核的第三方源、个人源或临时下载地址。
    - 3. 通过静态扫描与配置复核确认依赖安装流程是否会实际访问这些未审核来源。
    fix_suggestion: 仅允许经过审核的依赖源和镜像源，并封禁临时下载地址。
    source_context:
    - OpenSSF Secure Supply Chain Consumption Framework
    - 链接：https://openssf.org/community/ssc-framework/
    - 关键上下文：Use Trusted Registries；Verify Provenance of Dependencies
    - OWASP Software Supply Chain Security Cheat Sheet
    - 链接：https://cheatsheetseries.owasp.org/cheatsheets/Software_Supply_Chain_Security_Cheat_Sheet.html
    - 关键上下文：Use Trusted Sources；Restrict Third-Party Registries
    detection:
      type: forbid_pattern
      include_globs: *id001
      patterns:
      - github\.com/.+\.(zip|tar\.gz)
      - curl.+pip
      - raw\.githubusercontent\.com
      - http://.+/simple/
      - pip install https?://
      - npm install https?://
      - yarn add https?://
      - go install .+@latest
      - composer require .+https?://
      - gem install .+--source
      - nuget add source
      - Maven\s+repository
      - gradle\s+repositories
      - ivy\s*\{
      - helm repo add
      pass_if: no_match
      reason: 发现禁用模式即判定未通过
    pass_condition: no_match
    on_fail:
      action: require_review
      reason: 未通过静态规则：检查是否从未经审核的第三方源下载依赖
  - id: S2-05-012
    item: 检查是否从可变更 URL 拉取运行依赖或规则制品
    stage: 设计阶段
    risk_personal: 高
    risk_nonpersonal: 中
    detection_target: 检测技能是否会从可变更 URL 拉取运行依赖或规则制品，重点核查下载逻辑、配置地址和启动流程。
    detection_method: 静态检查+运行路径复核。原因：需要同时确认代码路径、地址稳定性和加载约束，适合通过静态检查判断。
    verification_steps:
    - 1. 检查启动逻辑、下载函数和配置文件，识别是否存在直接从 URL 拉取运行依赖或规则制品的行为。
    - 2. 复核 URL 是否可变、是否缺少固定版本、哈希或签名约束。
    - 3. 通过静态扫描与配置复核确认首次运行或启动时是否会实际执行该拉取行为。
    fix_suggestion: 将运行依赖收敛到构建阶段固定制品，禁止运行时从可变 URL 直接拉取。
    source_context:
    - OWASP Software Supply Chain Security Cheat Sheet
    - 链接：https://cheatsheetseries.owasp.org/cheatsheets/Software_Supply_Chain_Security_Cheat_Sheet.html
    - 关键上下文：Pin Sources；Verify Integrity；Prefer Immutable Artifacts
    - OpenSSF Secure Supply Chain Consumption Framework
    - 链接：https://openssf.org/community/ssc-framework/
    - 关键上下文：Verify Provenance of Dependencies；Pin and Verify Dependencies
    detection:
      type: forbid_pattern
      include_globs: *id001
      patterns:
      - https?://.+(latest|main|master)
      - raw\.githubusercontent\.com/.+/(main|master)/
      - download.*https?://
      - curl\s+-O
      - wget\s+
      - Invoke-WebRequest
      - Invoke-RestMethod
      - WebClient\.DownloadFile
      - HttpClient\.GetAsync
      - http\.Get\(
      - urllib\.request
      - requests\.get
      - axios\.get
      - fetch\(
      - DownloadString
      - download_to_file
      - go-getter
      pass_if: no_match
      reason: 发现可变下载源信号且缺少完整性或固定版本控制时判定未通过
      danger_patterns:
      - https?://.+(latest|main|master)
      - raw\.githubusercontent\.com/.+/(main|master)/
      - download.*https?://
      - curl\s+-O
      - wget\s+
      - Invoke-WebRequest
      - Invoke-RestMethod
      - WebClient\.DownloadFile
      - HttpClient\.GetAsync
      - http\.Get\(
      - urllib\.request
      - requests\.get
      - axios\.get
      - fetch\(
      - DownloadString
      - download_to_file
      - go-getter
      control_include_globs: *id001
      control_patterns:
      - sha256
      - sha512
      - checksum
      - hash
      - signature
      - sigstore
      - cosign
      - gpg
      - verify
      - pinned
      - immutable
      - version pin
      - digest
      - '@sha256:'
      match_logic: danger_without_control
      fail_when: danger_match_and_control_missing
    pass_condition: no_danger_match_or_control_match
    on_fail:
      action: require_review
      reason: 未通过静态规则：检查是否从可变更 URL 拉取运行依赖或规则制品
  - id: S2-05-013
    item: 检查是否缺少远程 Prompt 或规则文件哈希校验
    stage: 设计阶段
    risk_personal: 高
    risk_nonpersonal: 中
    detection_target: 检测远程 Prompt 或规则文件是否缺少哈希校验，重点核查远程资源配置、下载逻辑和完整性验证流程。
    detection_method: 静态分析+远程资源加载复核。原因：需要确认资源来源、完整性校验和加载约束，适合通过静态检查判断。
    verification_steps:
    - 1. 检查远程 Prompt、规则文件或模板资源的下载与加载逻辑。
    - 2. 复核是否对远程文件执行固定哈希校验，以及哈希是否随版本同步管理。
    - 3. 通过静态扫描与配置复核确认远程文件被替换后系统是否会拒绝加载。
    fix_suggestion: 为远程 Prompt 与规则文件增加哈希固定和变更审批。
    source_context:
    - OWASP Software Supply Chain Security Cheat Sheet
    - 链接：https://cheatsheetseries.owasp.org/cheatsheets/Software_Supply_Chain_Security_Cheat_Sheet.html
    - 关键上下文：Verify Integrity；Prefer Immutable Artifacts
    - OpenSSF Secure Supply Chain Consumption Framework
    - 链接：https://openssf.org/community/ssc-framework/
    - 关键上下文：Pin and Verify Dependencies；Verify Artifact Metadata
    detection:
      type: require_pattern
      include_globs: *id002
      patterns:
      - sha256
      - hashlib
      - integrity
      pass_if: match_found
      reason: 必须发现控制证据才判定通过
    pass_condition: match_found
    on_fail:
      action: require_review
      reason: 未通过静态规则：检查是否缺少远程 Prompt 或规则文件哈希校验
  - id: S2-05-014
    item: 检查是否缺少远程配置文件签名或来源校验
    stage: 设计阶段
    risk_personal: 高
    risk_nonpersonal: 中
    detection_target: 检测远程配置文件是否缺少签名或来源校验，重点核查下载地址、签名验证和来源白名单。
    detection_method: 静态分析+远程配置加载复核+隔离验证。原因：该问题取决于来源控制和签名验证是否完整，需要结合加载路径和结果判断。
    verification_steps:
    - 1. 检查远程配置文件的来源地址、下载逻辑和加载条件。
    - 2. 复核是否对配置文件进行签名验证或来源白名单校验。
    - 3. 通过静态扫描与配置复核确认非白名单来源或伪造配置是否会被拒绝。
    fix_suggestion: 为远程配置启用签名验证和来源白名单。
    source_context:
    - OWASP Software Supply Chain Security Cheat Sheet
    - 链接：https://cheatsheetseries.owasp.org/cheatsheets/Software_Supply_Chain_Security_Cheat_Sheet.html
    - 关键上下文：Verify Provenance；Use Trusted Sources；Verify Integrity
    - OpenSSF Secure Supply Chain Consumption Framework
    - 链接：https://openssf.org/community/ssc-framework/
    - 关键上下文：Verify Provenance of Dependencies；Use Trusted Registries
    detection:
      type: require_pattern
      include_globs: *id002
      patterns:
      - signature
      - verify
      - allowlist
      - trusted[_-]?source
      pass_if: match_found
      reason: 必须发现控制证据才判定通过
    pass_condition: match_found
    on_fail:
      action: require_review
      reason: 未通过静态规则：检查是否缺少远程配置文件签名或来源校验
  - id: S2-05-015
    item: 检查是否缺少技能发布包哈希校验
    stage: 设计阶段
    risk_personal: 高
    risk_nonpersonal: 中
    detection_target: 检测技能发布包是否缺少哈希校验，重点核查发布流程、安装流程和制品校验元数据。
    detection_method: 发布流程审查+制品校验复核+隔离验证。原因：该问题属于交付物完整性控制，需要检查发布、分发和入库环节是否真正校验。
    verification_steps:
    - 1. 检查技能发布流程是否生成并分发发布包哈希。
    - 2. 复核安装或入库流程是否会对发布包执行哈希校验。
    - 3. 通过静态扫描与配置复核确认发布包被篡改后是否会被拒绝入库或安装。
    fix_suggestion: 在发布和安装环节校验技能包哈希，阻止篡改包落地。
    source_context:
    - OWASP Software Supply Chain Security Cheat Sheet
    - 链接：https://cheatsheetseries.owasp.org/cheatsheets/Software_Supply_Chain_Security_Cheat_Sheet.html
    - 关键上下文：Verify Integrity；Artifact Metadata；Release Integrity
    - SLSA
    - 链接：https://slsa.dev/
    - 关键上下文：Artifact Integrity；Build Integrity
    detection:
      type: require_pattern
      include_globs: *id002
      patterns:
      - sha256
      - hash
      - checksum
      pass_if: match_found
      reason: 必须发现控制证据才判定通过
    pass_condition: match_found
    on_fail:
      action: require_review
      reason: 未通过静态规则：检查是否缺少技能发布包哈希校验
  - id: S2-05-016
    item: 检查是否缺少技能发布包签名校验
    stage: 设计阶段
    risk_personal: 高
    risk_nonpersonal: 中
    detection_target: 检测技能发布包是否缺少签名校验，重点核查签名生成、验签流程和签发主体校验。
    detection_method: 发布流程审查+验签流程复核+隔离验证。原因：该问题需要同时确认签名生成、验签逻辑和签发主体校验是否成立。
    verification_steps:
    - 1. 检查技能发布流程是否为发布包生成签名。
    - 2. 复核入库或安装流程是否会执行验签，并校验签发主体是否可信。
    - 3. 通过静态扫描与配置复核确认签名缺失或签名伪造的发布包是否会被拒绝。
