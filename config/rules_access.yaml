scene: 场景二
scope: 技能入库前安全审查规则
source_workbook: 场景二-技能入库前安全审查表.xlsx
decision_policy:
  nonpersonal_high: block
  nonpersonal_medium: require_review
  nonpersonal_low: record_and_pass
  notes:
  - 规则以场景二最终评估项为准。
  - 仅对应 skills 入库前安全审查。
  - 统一按零信任检查自研与第三方技能。
  - 已剔除非 skills 入库前审查范围的条目。
rule_groups:
- id: S2-G01
  category: 恶意行为与代码安全类
  enforcement_mapping:
    high: block
    medium: require_review
    low: record_and_pass
  items:
  - id: S2-01-001
    item: 检查是否调用系统破坏命令
    stage: 设计阶段
    risk_personal: 高
    risk_nonpersonal: 高
    detection_target: 检测“检查是否调用系统破坏命令”是否在技能实现、配置或说明文档中真实存在，重点核查 启动脚本/主流程代码。
    detection_method: 静态检查为主，结合人工复核。原因：该类风险通常具有明确代码、脚本或配置特征，适合通过静态扫描、模式匹配和上下文复核判断。
    verification_steps:
    - 1. 人工检查 启动脚本/主流程代码，确认是否存在与“检查是否调用系统破坏命令”对应的实现入口、配置项或文档描述。
    - 2. 用代码搜索定位高风险函数、命令、路径、网络目标或依赖声明，并结合上下文复核是否可被外部输入触发。
    - 3. 通过静态代码路径、配置约束和文档声明复核，确认“可删除系统文件、破坏运行环境”是否能够真实发生，并记录触发条件、影响范围和阻断点。
    fix_suggestion: 删除破坏性命令，仅保留白名单安全操作。同时补充最小权限、输入校验、可观测性和默认拒绝策略。
    source_context:
    - OWASP AI Agent Security Cheat Sheet
    - 链接：https://cheatsheetseries.owasp.org/cheatsheets/AI_Agent_Security_Cheat_Sheet.html
    - 关键上下文：Key Risks；Tool Security & Least Privilege
    - MITRE CWE-78 OS Command Injection
    - 链接：https://cwe.mitre.org/data/definitions/78.html
    - 关键上下文：Description；Potential Mitigations；Detection Methods
    detection:
      type: forbid_pattern
      include_globs: &id001
      - '**/*.py'
      - '**/*.js'
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.jsx'
      - '**/*.go'
      - '**/*.java'
      - '**/*.kt'
      - '**/*.kts'
      - '**/*.scala'
      - '**/*.groovy'
      - '**/*.rb'
      - '**/*.php'
      - '**/*.cs'
      - '**/*.vb'
      - '**/*.rs'
      - '**/*.c'
      - '**/*.cc'
      - '**/*.cpp'
      - '**/*.cxx'
      - '**/*.h'
      - '**/*.hpp'
      - '**/*.swift'
      - '**/*.m'
      - '**/*.mm'
      - '**/*.lua'
      - '**/*.pl'
      - '**/*.pm'
      - '**/*.r'
      - '**/*.dart'
      - '**/*.sh'
      - '**/*.bash'
      - '**/*.zsh'
      - '**/*.ps1'
      - '**/*.bat'
      - '**/*.cmd'
      - '**/*.json'
      - '**/*.yaml'
      - '**/*.yml'
      - '**/*.xml'
      - '**/*.toml'
      - '**/*.ini'
      - '**/*.conf'
      - '**/*.properties'
      - '**/*.gradle'
      - '**/*.sbt'
      - '**/*.sql'
      - '**/*.proto'
      - '**/*.env*'
      - '**/Dockerfile'
      - '**/Makefile'
      patterns:
      - rm\s+-rf\s+/
      - dd\s+if=/dev/zero
      - mkfs\.
      - shutdown\b
      - reboot\b
      pass_if: no_match
      reason: 发现禁用模式即判定未通过
    pass_condition: no_match
    on_fail:
      action: block
      reason: 未通过静态规则：检查是否调用系统破坏命令
  - id: S2-01-002
    item: 检查是否建立反弹 Shell 远控连接
    stage: 设计阶段
    risk_personal: 高
    risk_nonpersonal: 高
    detection_target: 检测“检查是否建立反弹 Shell 远控连接”是否在技能实现、配置或说明文档中真实存在，重点核查 网络通信/命令执行代码。
    detection_method: 静态检查为主，结合人工复核。原因：该类风险通常具有明确代码、脚本或配置特征，适合通过静态扫描、模式匹配和上下文复核判断。
    verification_steps:
    - 1. 人工检查 网络通信/命令执行代码，确认是否存在与“检查是否建立反弹 Shell 远控连接”对应的实现入口、配置项或文档描述。
    - 2. 用代码搜索定位高风险函数、命令、路径、网络目标或依赖声明，并结合上下文复核是否可被外部输入触发。
    - 3. 通过静态代码路径、配置约束和文档声明复核，确认“可被远程控制，获取主机权限”是否能够真实发生，并记录触发条件、影响范围和阻断点。
    fix_suggestion: 移除反弹连接逻辑，禁止主动远控。同时补充最小权限、输入校验、可观测性和默认拒绝策略。
    source_context:
    - OWASP AI Agent Security Cheat Sheet
    - 链接：https://cheatsheetseries.owasp.org/cheatsheets/AI_Agent_Security_Cheat_Sheet.html
    - 关键上下文：Key Risks；Tool Security & Least Privilege
    - MITRE CWE-78 OS Command Injection
    - 链接：https://cwe.mitre.org/data/definitions/78.html
    - 关键上下文：Description；Potential Mitigations；Detection Methods
    detection:
      type: forbid_pattern
      include_globs: *id001
      patterns:
      - nc\s+-e\s+/bin/sh
      - /dev/tcp/.+sh
      - bash\s+-i
      - socat.+exec
      pass_if: no_match
      reason: 发现禁用模式即判定未通过
    pass_condition: no_match
    on_fail:
      action: block
      reason: 未通过静态规则：检查是否建立反弹 Shell 远控连接
  - id: S2-01-003
    item: 检查是否包含挖矿进程拉起逻辑
    stage: 设计阶段
    risk_personal: 高
    risk_nonpersonal: 高
    detection_target: 检测“检查是否包含挖矿进程拉起逻辑”是否在技能实现、配置或说明文档中真实存在，重点核查 后台任务/加密逻辑代码。
    detection_method: 静态检查为主，结合人工复核。原因：该类风险通常具有明确代码、脚本或配置特征，适合通过静态扫描、模式匹配和上下文复核判断。
    verification_steps:
    - 1. 人工检查 后台任务/加密逻辑代码，确认是否存在与“检查是否包含挖矿进程拉起逻辑”对应的实现入口、配置项或文档描述。
    - 2. 用代码搜索定位高风险函数、命令、路径、网络目标或依赖声明，并结合上下文复核是否可被外部输入触发。
    - 3. 通过静态代码路径、配置约束和文档声明复核，确认“占用系统资源、加密数据勒索”是否能够真实发生，并记录触发条件、影响范围和阻断点。
    fix_suggestion: 移除挖矿/勒索逻辑，禁止数据加密。同时补充最小权限、输入校验、可观测性和默认拒绝策略。
    source_context:
    - OWASP AI Agent Security Cheat Sheet
    - 链接：https://cheatsheetseries.owasp.org/cheatsheets/AI_Agent_Security_Cheat_Sheet.html
    - 关键上下文：Key Risks；Monitoring and Logging
    - NIST AI Risk Management Framework
    - 链接：https://www.nist.gov/itl/ai-risk-management-framework
    - 关键上下文：Govern；Measure；Manage
    detection:
      type: forbid_pattern
      include_globs: *id001
      patterns:
      - stratum\+tcp://
      - xmrig
      - mining
      - monero
      pass_if: no_match
      reason: 发现禁用模式即判定未通过
    pass_condition: no_match
    on_fail:
      action: block
      reason: 未通过静态规则：检查是否包含挖矿进程拉起逻辑
  - id: S2-01-004
    item: 检查是否包含勒索式文件加密逻辑
