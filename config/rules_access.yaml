  - id: S2-01-008
    item: 检查是否存在下载后直接执行链路
    stage: 设计阶段
    risk_personal: 高
    risk_nonpersonal: 高
    detection_target: 检测“检查是否存在下载后直接执行链路”是否在技能实现、配置或说明文档中真实存在，重点核查 更新/下载/安装脚本。
    detection_method: 静态检查为主，结合人工复核。原因：该类风险通常具有明确代码、脚本或配置特征，适合通过静态扫描、模式匹配和上下文复核判断。
    verification_steps:
    - 1. 人工检查 更新/下载/安装脚本，确认是否存在与“检查是否存在下载后直接执行链路”对应的实现入口、配置项或文档描述。
    - 2. 用代码搜索定位高风险函数、命令、路径、网络目标或依赖声明，并结合上下文复核是否可被外部输入触发。
    - 3. 通过静态代码路径、配置约束和文档声明复核，确认“绕过入库审查，执行远程未知代码”是否能够真实发生，并记录触发条件、影响范围和阻断点。
    fix_suggestion: 禁止下载执行，依赖通过供应链流程引入。同时补充最小权限、输入校验、可观测性和默认拒绝策略。
    source_context:
    - OWASP AI Agent Security Cheat Sheet
    - 链接：https://cheatsheetseries.owasp.org/cheatsheets/AI_Agent_Security_Cheat_Sheet.html
    - 关键上下文：Key Risks；Tool Security & Least Privilege；Human-in-the-Loop Controls
    - MITRE CWE-78 OS Command Injection
    - 链接：https://cwe.mitre.org/data/definitions/78.html
    - 关键上下文：Description；Potential Mitigations；Detection Methods
    detection:
      type: forbid_pattern
      include_globs: *id001
      patterns:
      - curl.+\|.+sh
      - wget.+\|.+sh
      - download.+exec
      - Invoke-WebRequest.+iex
      pass_if: no_match
      reason: 发现禁用模式即判定未通过
    pass_condition: no_match
    on_fail:
      action: block
      reason: 未通过静态规则：检查是否存在下载后直接执行链路
  - id: S2-01-009
    item: 检查是否在运行时动态安装依赖
    stage: 设计阶段
    risk_personal: 高
    risk_nonpersonal: 高
    detection_target: 检测“检查是否在运行时动态安装依赖”是否在技能实现、配置或说明文档中真实存在，重点核查 运行脚本、启动逻辑。
    detection_method: 静态检查为主，结合人工复核。原因：该类风险通常具有明确代码、脚本或配置特征，适合通过静态扫描、模式匹配和上下文复核判断。
    verification_steps:
    - 1. 人工检查 运行脚本、启动逻辑，确认是否存在与“检查是否在运行时动态安装依赖”对应的实现入口、配置项或文档描述。
    - 2. 用代码搜索定位高风险函数、命令、路径、网络目标或依赖声明，并结合上下文复核是否可被外部输入触发。
    - 3. 通过静态代码路径、配置约束和文档声明复核，确认“运行时装包，引入恶意/漏洞依赖”是否能够真实发生，并记录触发条件、影响范围和阻断点。
    fix_suggestion: 统一在构建阶段安装，运行时禁止安装。同时补充最小权限、输入校验、可观测性和默认拒绝策略。
    source_context:
    - OWASP AI Agent Security Cheat Sheet
    - 链接：https://cheatsheetseries.owasp.org/cheatsheets/AI_Agent_Security_Cheat_Sheet.html
    - 关键上下文：Key Risks；Tool Security & Least Privilege；Human-in-the-Loop Controls
    - MITRE CWE-78 OS Command Injection
    - 链接：https://cwe.mitre.org/data/definitions/78.html
    - 关键上下文：Description；Potential Mitigations；Detection Methods
    detection:
      type: forbid_pattern
      include_globs: *id001
      patterns:
      - pip\s+install
      - npm\s+install
      - yarn\s+add
      - pnpm\s+add
      - go\s+get
      pass_if: no_match
      reason: 发现禁用模式即判定未通过
    pass_condition: no_match
    on_fail:
      action: block
      reason: 未通过静态规则：检查是否在运行时动态安装依赖
  - id: S2-01-010
    item: 检查是否暴露未鉴权调试接口
    stage: 设计阶段
    risk_personal: 高
    risk_nonpersonal: 低
    detection_target: 检测“检查是否暴露未鉴权调试接口”是否在技能实现、配置或说明文档中真实存在，重点核查 路由、配置。
    detection_method: 静态检查为主，结合人工复核。原因：该类风险通常具有明确代码、脚本或配置特征，适合通过静态扫描、模式匹配和上下文复核判断。
    verification_steps:
    - 1. 人工检查 路由、配置，确认是否存在与“检查是否暴露未鉴权调试接口”对应的实现入口、配置项或文档描述。
    - 2. 用代码搜索定位高风险函数、命令、路径、网络目标或依赖声明，并结合上下文复核是否可被外部输入触发。
    - 3. 通过静态代码路径、配置约束和文档声明复核，确认“生产环境残留调试入口”是否能够真实发生，并记录触发条件、影响范围和阻断点。
    fix_suggestion: 移除或仅测试环境开启。同时补充最小权限、输入校验、可观测性和默认拒绝策略。
    source_context:
    - OWASP AI Agent Security Cheat Sheet
    - 链接：https://cheatsheetseries.owasp.org/cheatsheets/AI_Agent_Security_Cheat_Sheet.html
    - 关键上下文：Key Risks；Tool Security & Least Privilege；Human-in-the-Loop Controls
    - MITRE CWE-78 OS Command Injection
    - 链接：https://cwe.mitre.org/data/definitions/78.html
    - 关键上下文：Description；Potential Mitigations；Detection Methods
    detection:
      type: forbid_pattern
      include_globs: *id001
      patterns:
      - /debug
      - debug\s*=\s*true
      - test_backdoor
      - admin_debug
      pass_if: no_match
      reason: 发现禁用模式即判定未通过
    pass_condition: no_match
    on_fail:
      action: require_review
      reason: 未通过静态规则：检查是否暴露未鉴权调试接口
- id: S2-G02
  category: 数据安全与隐私保护类
  enforcement_mapping:
    high: block
    medium: require_review
    low: record_and_pass
  items:
  - id: S2-02-001
    item: 检查是否将凭据或密钥发送到未声明外部目标
    stage: 设计阶段
    risk_personal: 高
    risk_nonpersonal: 高
    detection_target: 检测技能是否会把凭据、密钥或令牌发送到未声明外部目标，重点核查网络请求、外发参数和外联白名单。
    detection_method: 静态分析+数据流审查+人工复核。原因：该问题需要同时确认敏感字段来源、出站链路和目标地址，应通过静态扫描和链路复核判断风险。
    verification_steps:
    - 1. 人工检查网络请求、Webhook、HTTP 客户端和数据出站逻辑，确认是否会发送凭据、密钥或令牌。
    - 2. 核对外联目标是否出现在技能声明、权限说明和白名单配置中。
    - 3. 通过静态代码路径、配置约束和文档声明复核，确认系统是否会把敏感字段直接发往未声明目标。
    fix_suggestion: 限制外发目标并默认拦截凭据类字段，敏感字段出站前强制脱敏或拒绝。
    source_context:
    - OWASP Top 10 for LLM Applications - LLM06 Sensitive Information Disclosure
    - 链接：https://genai.owasp.org/llm-top-10/llm06-sensitive-information-disclosure/
    - 关键上下文：Description；Common Examples；Prevention and Mitigation
    - OWASP Secrets Management Cheat Sheet
    - 链接：https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html
    - 关键上下文：2.1 Centralize and Standardize；2.7 Rotation；2.8 Revocation
    detection:
      type: forbid_pattern
      include_globs: *id001
      patterns:
      - Authorization
      - Bearer\s+
      - api[_-]?key
      - secret
      - token
      pass_if: no_match
      reason: 发现凭据外发危险信号且缺少外联白名单、脱敏或阻断控制时判定未通过
      control_include_globs: *id001
      control_patterns:
      - allowlist
      - whitelist
      - trusted_host
      - approved_domain
      - redact
      - mask
      - drop secret
      - deny outbound
      - egress policy
      - webhook allowlist
      match_logic: danger_without_control
      fail_when: danger_match_and_control_missing
      danger_patterns:
      - Authorization
      - Bearer\s+
      - api[_-]?key
      - secret
      - token
    pass_condition: no_danger_match_or_control_match
    on_fail:
      action: block
      reason: 未通过静态规则：检查是否将凭据或密钥发送到未声明外部目标
  - id: S2-02-002
    item: 检查是否将用户隐私数据发送到未声明外部目标
    stage: 设计阶段
    risk_personal: 高
    risk_nonpersonal: 高
    detection_target: 检测技能是否会把用户隐私数据发送到未声明外部目标，重点核查数据字段、网络出站链路和外联白名单。
    detection_method: 静态分析+数据流审查+人工复核。原因：需要同时确认隐私字段来源、出站路径和目标声明情况，应通过静态扫描和链路复核判断风险。
    verification_steps:
    - 1. 人工检查数据采集、网络出站和第三方接口调用逻辑，识别是否会发送用户隐私字段。
    - 2. 核对发送目标是否在技能说明、权限清单和白名单中被明确声明。
    - 3. 通过静态代码路径、配置约束和文档声明复核，确认隐私字段是否会被直接发送到未声明外部目标。
    fix_suggestion: 将隐私数据出站改为最小化字段集，并增加授权、脱敏和白名单控制。
    source_context:
    - OWASP Top 10 for LLM Applications - LLM06 Sensitive Information Disclosure
    - 链接：https://genai.owasp.org/llm-top-10/llm06-sensitive-information-disclosure/
    - 关键上下文：Description；Common Examples；Prevention and Mitigation
    - OWASP User Privacy Protection Cheat Sheet
    - 链接：https://cheatsheetseries.owasp.org/cheatsheets/User_Privacy_Protection_Cheat_Sheet.html
    - 关键上下文：Minimize Data Collection；Support Deletion；Protect Data in Transit
    detection:
      type: forbid_pattern
      include_globs: *id001
      patterns:
      - email
      - phone
      - id[_-]?card
      - address
      - user.*profile
      pass_if: no_match
      reason: 发现隐私外发危险信号且缺少白名单、脱敏或最小化控制时判定未通过
      control_include_globs: *id001
      control_patterns:
      - allowlist
      - whitelist
      - trusted_host
      - approved_domain
      - redact
      - mask
      - minimize
      - field filter
      - deny outbound
      - egress policy
      match_logic: danger_without_control
      fail_when: danger_match_and_control_missing
      danger_patterns:
      - email
      - phone
      - id[_-]?card
      - address
      - user.*profile
    pass_condition: no_danger_match_or_control_match
    on_fail:
      action: block
      reason: 未通过静态规则：检查是否将用户隐私数据发送到未声明外部目标
  - id: S2-02-003
    item: 检查是否通过隐蔽通道外发敏感数据
    stage: 设计阶段
    risk_personal: 高
    risk_nonpersonal: 高
    detection_target: 检测“检查是否通过隐蔽通道外发敏感数据”是否在技能实现、配置或说明文档中真实存在，重点核查 DNS/Webhook/Socket通信代码。
    detection_method: 静态检查为主，结合人工复核。原因：该类风险通常具有明确代码、脚本或配置特征，适合通过静态扫描、模式匹配和上下文复核判断。
    verification_steps:
    - 1. 人工检查 DNS/Webhook/Socket通信代码，确认是否存在与“检查是否通过隐蔽通道外发敏感数据”对应的实现入口、配置项或文档描述。
    - 2. 用代码搜索定位高风险函数、命令、路径、网络目标或依赖声明，并结合上下文复核是否可被外部输入触发。
    - 3. 通过静态代码路径、配置约束和文档声明复核，确认“使用隐蔽服务外发敏感数据”是否能够真实发生，并记录触发条件、影响范围和阻断点。
    fix_suggestion: 禁止使用隐蔽通信服务，启用出口审计。同时补充最小权限、输入校验、可观测性和默认拒绝策略。
    source_context:
    - OWASP Top 10 for LLM Applications - LLM06 Sensitive Information Disclosure
    - 链接：https://genai.owasp.org/llm-top-10/llm06-sensitive-information-disclosure/
    - 关键上下文：Description；Example Attack Scenarios；Prevention and Mitigation
    - OWASP AI Agent Security Cheat Sheet
    - 链接：https://cheatsheetseries.owasp.org/cheatsheets/AI_Agent_Security_Cheat_Sheet.html
    - 关键上下文：Tool Security & Least Privilege；Monitoring and Logging
    detection:
      type: forbid_pattern
      include_globs: *id001
      patterns:
      - pastebin
      - ngrok
      - torproject
      - duckdns
      - websocket
      - irc://
      - dns.*txt
      pass_if: no_match
      reason: 发现禁用模式即判定未通过
    pass_condition: no_match
    on_fail:
      action: block
      reason: 未通过静态规则：检查是否通过隐蔽通道外发敏感数据
  - id: S2-02-004
    item: 检查是否在源码中硬编码真实 API 密钥
    stage: 设计阶段
    risk_personal: 高
    risk_nonpersonal: 高
    detection_target: 检测源码中是否硬编码真实 API 密钥，重点核查常量定义、默认配置和样例代码。
    detection_method: 静态分析+人工复核。原因：硬编码密钥主要存在于源码和配置文本中，通过文本扫描和上下文确认最有效。
    verification_steps:
    - 1. 人工检查源码常量、默认配置和示例代码，确认是否直接包含真实 API 密钥。
    - 2. 用关键字和密钥格式规则搜索仓库内容，定位疑似真实密钥。
    - 3. 对疑似密钥进行上下文复核，确认是否为真实可用凭据而不是占位符。
    fix_suggestion: 移除源码中的真实密钥，改用密钥托管或环境注入。
    source_context:
    - MITRE CWE-798 Use of Hard-coded Credentials
    - 链接：https://cwe.mitre.org/data/definitions/798.html
    - 关键上下文：Description；Potential Mitigations；Detection Methods
    - OWASP Secrets Management Cheat Sheet
    - 链接：https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html
    - 关键上下文：2.4 Automate Secrets Management；2.7 Rotation
    detection:
      type: forbid_pattern
      include_globs: *id001
      patterns:
      - sk-[A-Za-z0-9]{20,}
      - AKIA[0-9A-Z]{16}
      - AIza[0-9A-Za-z\-_]{20,}
      - api[_-]?key\s*[:=]\s*["\'][^"\']{12,}
      pass_if: no_match
      reason: 发现禁用模式即判定未通过
    pass_condition: no_match
    on_fail:
      action: block
      reason: 未通过静态规则：检查是否在源码中硬编码真实 API 密钥
  - id: S2-02-005
    item: 检查是否在配置文件中硬编码真实访问令牌
    stage: 设计阶段
    risk_personal: 高
    risk_nonpersonal: 高
    detection_target: 检测配置文件中是否硬编码真实访问令牌，重点核查配置模板、环境样例和默认参数文件。
    detection_method: 静态分析+人工复核。原因：配置文件中的硬编码凭据是文本层问题，最适合通过静态检查与上下文确认完成。
    verification_steps:
    - 1. 人工检查配置文件、环境样例和默认参数，确认是否出现真实访问令牌。
    - 2. 用令牌格式和敏感关键字搜索配置目录，定位疑似真实凭据。
    - 3. 对疑似令牌做上下文复核，确认其是否可用于真实访问。
    fix_suggestion: 移除配置文件中的真实令牌，改用运行时安全注入和权限收敛。
    source_context:
    - MITRE CWE-798 Use of Hard-coded Credentials
    - 链接：https://cwe.mitre.org/data/definitions/798.html
    - 关键上下文：Description；Potential Mitigations；Detection Methods
    - OWASP Secrets Management Cheat Sheet
    - 链接：https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html
    - 关键上下文：2.1 Centralize and Standardize；2.4 Automate Secrets Management
    detection:
      type: forbid_pattern
      include_globs: *id001
      patterns:
      - token\s*[:=]\s*["\'][^"\']{12,}
      - Bearer\s+[A-Za-z0-9\-\._]{12,}
      - ghp_[A-Za-z0-9]{20,}
      pass_if: no_match
      reason: 发现禁用模式即判定未通过
    pass_condition: no_match
    on_fail:
      action: block
      reason: 未通过静态规则：检查是否在配置文件中硬编码真实访问令牌
  - id: S2-02-006
    item: 检查是否以明文缓存访问令牌
    stage: 设计阶段
    risk_personal: 高
    risk_nonpersonal: 中
    detection_target: 检测系统是否以明文形式缓存访问令牌，重点核查缓存层、会话存储和临时文件。
    detection_method: 静态分析+存储路径复核+隔离验证。原因：需要同时确认缓存位置、保存格式和可读取性。
    verification_steps:
    - 1. 检查缓存层、会话存储和本地临时文件中是否直接保存访问令牌明文。
    - 2. 复核令牌缓存是否设置最短 TTL、加密保护和按用户隔离。
    - 3. 通过静态扫描与配置复核确认令牌是否可被其他流程或任务直接读取。
    fix_suggestion: 改为加密缓存短期令牌，并设置最短可用 TTL。
    source_context:
    - OWASP Secrets Management Cheat Sheet
    - 链接：https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html
    - 关键上下文：2.3 Access Control；2.5 Audit；2.7 Rotation
    - OWASP Cryptographic Storage Cheat Sheet
    - 链接：https://cheatsheetseries.owasp.org/cheatsheets/Cryptographic_Storage_Cheat_Sheet.html
    - 关键上下文：Architectural Design；Minimise the Storage of Sensitive Information
    detection:
      type: forbid_pattern
      include_globs: *id001
      patterns:
      - redis\.set\(.+token
      - localStorage\.setItem\(.+token
      - cache\[.+token
      - writeFile\(.+token
      pass_if: no_match
      reason: 发现禁用模式即判定未通过
    pass_condition: no_match
    on_fail:
      action: require_review
      reason: 未通过静态规则：检查是否以明文缓存访问令牌
  - id: S2-02-007
    item: 检查是否以明文缓存长期凭据
    stage: 设计阶段
    risk_personal: 高
    risk_nonpersonal: 中
    detection_target: 检测系统是否以明文形式缓存长期凭据，重点核查本地存储、缓存层和会话持久化逻辑。
    detection_method: 静态分析+存储路径复核+隔离验证。原因：长期凭据风险取决于明文存储位置与可读取性，需要结合实现和运行结果判断。
    verification_steps:
    - 1. 检查长期凭据是否被直接保存到本地文件、缓存或数据库中。
    - 2. 复核存储位置是否经过加密、隔离和访问控制。
    - 3. 通过静态扫描与配置复核确认其他任务或进程是否可直接读取该长期凭据。
    fix_suggestion: 避免缓存长期凭据，改用一次性授权或按需换取短期凭据。
    source_context:
    - OWASP Secrets Management Cheat Sheet
    - 链接：https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html
    - 关键上下文：2.3 Access Control；2.4 Automate Secrets Management；2.8 Revocation
    - OWASP Cryptographic Storage Cheat Sheet
    - 链接：https://cheatsheetseries.owasp.org/cheatsheets/Cryptographic_Storage_Cheat_Sheet.html
    - 关键上下文：Architectural Design；Minimise the Storage of Sensitive Information
    detection:
      type: forbid_pattern
      include_globs: *id001
      patterns:
      - redis\.set\(.+token
      - localStorage\.setItem\(.+token
      - cache\[.+token
      - writeFile\(.+token
      pass_if: no_match
      reason: 发现禁用模式即判定未通过
    pass_condition: no_match
    on_fail:
      action: require_review
      reason: 未通过静态规则：检查是否以明文缓存长期凭据
  - id: S2-02-008
    item: 检查是否通过全局变量共享访问令牌
    stage: 设计阶段
    risk_personal: 高
    risk_nonpersonal: 中
    detection_target: 检测系统是否通过全局变量共享访问令牌，重点核查全局状态、单例对象和进程级上下文。
    detection_method: 静态检查+状态共享复核+隔离验证。原因：该问题不仅是代码模式，还需要确认是否真的发生跨任务共享。
    verification_steps:
    - 1. 检查代码中是否把访问令牌保存到全局变量、单例或共享上下文。
    - 2. 复核不同任务或不同用户是否会复用同一令牌对象。
    - 3. 通过静态扫描与配置复核确认新任务能否读取前一任务遗留的令牌值。
    fix_suggestion: 按用户或任务命名空间隔离令牌，禁止通过全局变量共享。
    source_context:
    - OWASP Secrets Management Cheat Sheet
    - 链接：https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html
    - 关键上下文：2.3 Access Control；2.6 Dynamic Secrets
    - OWASP Top 10 for LLM Applications - LLM06 Sensitive Information Disclosure
