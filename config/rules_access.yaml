- id: S2-G06
  category: 输入处理与注入防护类
  enforcement_mapping:
    high: block
    medium: require_review
    low: record_and_pass
  items:
  - id: S2-06-001
    item: 检查是否将外部输入直接拼接到 Shell 命令
    stage: 设计阶段
    risk_personal: 高
    risk_nonpersonal: 中
    detection_target: 检测“检查是否将外部输入直接拼接到 Shell 命令”是否在技能实现、配置或说明文档中真实存在，重点核查 命令拼接/执行代码。
    detection_method: 静态检查为主，结合人工复核。原因：该类风险通常具有明确代码、脚本或配置特征，适合通过静态扫描、模式匹配和上下文复核判断。
    verification_steps:
    - 1. 人工检查 命令拼接/执行代码，确认是否存在与“检查是否将外部输入直接拼接到 Shell 命令”对应的实现入口、配置项或文档描述。
    - 2. 用代码搜索定位高风险函数、命令、路径、网络目标或依赖声明，并结合上下文复核是否可被外部输入触发。
    - 3. 通过静态代码路径、配置约束和文档声明复核，确认“用户输入直接拼接Shell，可执行任意命令”是否能够真实发生，并记录触发条件、影响范围和阻断点。
    fix_suggestion: 使用参数化命令，禁止字符串拼接。同时补充最小权限、输入校验、可观测性和默认拒绝策略。
    source_context:
    - OWASP Input Validation Cheat Sheet
    - 链接：https://cheatsheetseries.owasp.org/cheatsheets/Input_Validation_Cheat_Sheet.html
    - 关键上下文：Allowlist Validation；Schema Validation
    - OWASP Top 10 for LLM Applications
    - 链接：https://genai.owasp.org/llm-top-10/
    - 关键上下文：Prompt Injection；Insecure Output Handling
    detection:
      type: forbid_pattern
      include_globs: *id001
      patterns:
      - os\.system\(.+input
      - subprocess\..+\+.+input
      - exec\(.+input
      pass_if: no_match
      reason: 发现禁用模式即判定未通过
    pass_condition: no_match
    on_fail:
      action: require_review
      reason: 未通过静态规则：检查是否将外部输入直接拼接到 Shell 命令
  - id: S2-06-002
    item: 检查是否将外部输入直接拼接到系统 Prompt
    stage: 设计阶段
    risk_personal: /
    risk_nonpersonal: 低
    detection_target: 检测“检查是否将外部输入直接拼接到系统 Prompt”是否在技能实现、配置或说明文档中真实存在，重点核查 Prompt构造/拼接代码。
    detection_method: 静态检查为主，结合人工复核。原因：该类风险通常具有明确代码、脚本或配置特征，适合通过静态扫描、模式匹配和上下文复核判断。
    verification_steps:
    - 1. 人工检查 Prompt构造/拼接代码，确认是否存在与“检查是否将外部输入直接拼接到系统 Prompt”对应的实现入口、配置项或文档描述。
    - 2. 用代码搜索定位高风险函数、命令、路径、网络目标或依赖声明，并结合上下文复核是否可被外部输入触发。
    - 3. 通过静态代码路径、配置约束和文档声明复核，确认“用户输入直接注入系统提示词，篡改指令”是否能够真实发生，并记录触发条件、影响范围和阻断点。
    fix_suggestion: 增加Prompt护栏，隔离用户输入与系统指令。同时补充最小权限、输入校验、可观测性和默认拒绝策略。
    source_context:
    - OWASP Input Validation Cheat Sheet
    - 链接：https://cheatsheetseries.owasp.org/cheatsheets/Input_Validation_Cheat_Sheet.html
    - 关键上下文：Allowlist Validation；Schema Validation
    - OWASP Top 10 for LLM Applications
    - 链接：https://genai.owasp.org/llm-top-10/
    - 关键上下文：Prompt Injection；Insecure Output Handling
    detection:
      type: forbid_pattern
      include_globs: *id001
      patterns:
      - system[_-]?prompt.+\+
      - prompt.+input
      - messages.+system.+content.+input
      pass_if: no_match
      reason: 发现禁用模式即判定未通过
    pass_condition: no_match
    on_fail:
      action: require_review
      reason: 未通过静态规则：检查是否将外部输入直接拼接到系统 Prompt
  - id: S2-06-003
    item: 检查是否将外部输入直接拼接到 SQL 语句
    stage: 设计阶段
    risk_personal: 高
    risk_nonpersonal: 中
    detection_target: 检测“检查是否将外部输入直接拼接到 SQL 语句”是否在技能实现、配置或说明文档中真实存在，重点核查 SQL拼接/查询代码。
    detection_method: 静态检查为主，结合人工复核。原因：该类风险通常具有明确代码、脚本或配置特征，适合通过静态扫描、模式匹配和上下文复核判断。
    verification_steps:
    - 1. 人工检查 SQL拼接/查询代码，确认是否存在与“检查是否将外部输入直接拼接到 SQL 语句”对应的实现入口、配置项或文档描述。
    - 2. 用代码搜索定位高风险函数、命令、路径、网络目标或依赖声明，并结合上下文复核是否可被外部输入触发。
    - 3. 通过静态代码路径、配置约束和文档声明复核，确认“用户输入直接拼SQL，导致数据泄露/篡改”是否能够真实发生，并记录触发条件、影响范围和阻断点。
    fix_suggestion: 使用预编译语句、参数化查询。同时补充最小权限、输入校验、可观测性和默认拒绝策略。
    source_context:
    - OWASP Input Validation Cheat Sheet
    - 链接：https://cheatsheetseries.owasp.org/cheatsheets/Input_Validation_Cheat_Sheet.html
    - 关键上下文：Allowlist Validation；Schema Validation
    - OWASP Top 10 for LLM Applications
    - 链接：https://genai.owasp.org/llm-top-10/
    - 关键上下文：Prompt Injection；Insecure Output Handling
    detection:
      type: forbid_pattern
      include_globs: *id001
      patterns:
      - SELECT.+\+.+input
      - WHERE.+\+.+input
      - execute\(.+f["\"]
      pass_if: no_match
      reason: 发现禁用模式即判定未通过
    pass_condition: no_match
    on_fail:
      action: require_review
      reason: 未通过静态规则：检查是否将外部输入直接拼接到 SQL 语句
  - id: S2-06-004
    item: 检查是否缺少参数类型和格式校验
    stage: 设计阶段
    risk_personal: /
    risk_nonpersonal: 低
    detection_target: 检测“检查是否缺少参数类型和格式校验”是否在技能实现、配置或说明文档中真实存在，重点核查 工具入口、API handler、参数定义。
    detection_method: 静态检查为主，结合人工复核。原因：该类风险通常具有明确代码、脚本或配置特征，适合通过静态扫描、模式匹配和上下文复核判断。
    verification_steps:
    - 1. 人工检查 工具入口、API handler、参数定义，确认是否存在与“检查是否缺少参数类型和格式校验”对应的实现入口、配置项或文档描述。
    - 2. 用代码搜索定位高风险函数、命令、路径、网络目标或依赖声明，并结合上下文复核是否可被外部输入触发。
    - 3. 通过静态代码路径、配置约束和文档声明复核，确认“无类型/长度/格式约束，易注入、越权、崩溃”是否能够真实发生，并记录触发条件、影响范围和阻断点。
    fix_suggestion: 补充JSON Schema/Pydantic/Zod强校验。同时补充最小权限、输入校验、可观测性和默认拒绝策略。
    source_context:
    - OWASP Input Validation Cheat Sheet
    - 链接：https://cheatsheetseries.owasp.org/cheatsheets/Input_Validation_Cheat_Sheet.html
    - 关键上下文：Allowlist Validation；Schema Validation
    - OWASP Top 10 for LLM Applications
    - 链接：https://genai.owasp.org/llm-top-10/
    - 关键上下文：Prompt Injection；Insecure Output Handling
    detection:
