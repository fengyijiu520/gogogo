    risk_personal: /
    risk_nonpersonal: 低
    detection_target: 检测“检查是否缺少高危接口必填参数校验”是否在技能实现、配置或说明文档中真实存在，重点核查 文件/网络/命令相关入口。
    detection_method: 静态检查为主，结合人工复核。原因：该类风险通常具有明确代码、脚本或配置特征，适合通过静态扫描、模式匹配和上下文复核判断。
    verification_steps:
    - 1. 人工检查 文件/网络/命令相关入口，确认是否存在与“检查是否缺少高危接口必填参数校验”对应的实现入口、配置项或文档描述。
    - 2. 用代码搜索定位高风险函数、命令、路径、网络目标或依赖声明，并结合上下文复核是否可被外部输入触发。
    - 3. 通过静态代码路径、配置约束和文档声明复核，确认“关键参数为空仍可执行，导致异常”是否能够真实发生，并记录触发条件、影响范围和阻断点。
