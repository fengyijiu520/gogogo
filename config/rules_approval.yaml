        - fs\.write
        - open\(.+["\']w
        - '>\s*[^>]'
        - touch\s+
        - Files\.write
        - Files\.copy
        - FileOutputStream
        - os\.WriteFile
        - ioutil\.WriteFile
        - SaveUploadedFile
        - transferTo\(
        - Storage\:\:put
        - file_put_contents
        - Files.copy
        - Path\.of
        - System\.IO\.File\.WriteAll
        - CopyToAsync
        - fwrite\(
        exec:
        - os\.system
        - subprocess
        - exec\(
        - spawn\(
        - Runtime\.getRuntime
        - ProcessBuilder
        - system\(
        - passthru\(
        - shell_exec\(
        - execSync\(
        - child_process
        - Start-Process
        - CreateProcess
        - ShellExecute
        - cmd\.exe
        - powershell\.exe
        - Runtime\.exec
        - os\/exec
        - Command\(
        - proc_open\(
      pass_if: any_signal_missing
      reason: 注入、写入和执行信号同时存在时视为具备执行放大链潜力
    pass_condition: any_signal_missing
    on_fail:
      action: block
      reason: 未通过静态规则：检查注入与越权读写组合后是否可进入执行链路
  - id: S3-05-005
    item: 检查依赖合并后是否引入新高危漏洞版本
    stage: 设计阶段
    risk_personal: 中
    risk_nonpersonal: 高
    detection_target: 检测多个技能合并依赖后是否引入新的高危漏洞版本，重点核查版本冲突解决、依赖提升和最终安装结果。
    detection_method: 静态组合链路分析+人工复核。原因：组合风险取决于多个技能声明、输入输出关系和控制边界的静态可达路径，应通过静态链路分析判断。
    verification_steps:
    - 1. 汇总所有技能的依赖清单和锁定结果。
    - 2. 检查依赖合并或版本提升后是否引入已知高危漏洞版本。
    - 3. 在隔离环境复现合并安装结果，确认最终生效版本是否与单技能时期不同。
    fix_suggestion: 统一锁版本，依赖沙箱隔离。同时补充最小权限、默认拒绝、输入校验、统一日志和显式审批。
    source_context:
    - OWASP Software Supply Chain Security Cheat Sheet
    - 链接：https://cheatsheetseries.owasp.org/cheatsheets/Software_Supply_Chain_Security_Cheat_Sheet.html
    - 关键上下文：Dependency Management；Version Pinning；Reproducible Builds
    - OpenSSF Secure Supply Chain Consumption Framework
    - 链接：https://openssf.org/community/ssc-framework/
    - 关键上下文：Pin and Verify Dependencies；Track Component Origins
    detection:
      type: capability_chain
      include_globs: *id001
      signals:
        dependency:
        - package\.json
        - requirements
        - go\.mod
        - pom\.xml
        tool:
        - tool
        - plugin
        - mcp
        - invoke
      pass_if: any_signal_missing
      reason: 多技能仓库中出现多套依赖定义与加载信号时需要判定依赖冲突风险
    pass_condition: any_signal_missing
    on_fail:
      action: block
      reason: 未通过静态规则：检查依赖合并后是否引入新高危漏洞版本
  - id: S3-05-006
    item: 检查依赖覆盖是否导致安全功能失效
    stage: 设计阶段
    risk_personal: 中
    risk_nonpersonal: 高
    detection_target: 检测多个技能的依赖覆盖或加载顺序是否会导致安全功能失效，重点核查鉴权、校验、日志或隔离能力是否因冲突被绕过。
    detection_method: 静态组合链路分析+人工复核。原因：组合风险取决于多个技能声明、输入输出关系和控制边界的静态可达路径，应通过静态链路分析判断。
    verification_steps:
    - 1. 识别依赖覆盖、猴子补丁、插件覆盖或加载顺序冲突点。
    - 2. 检查安全相关功能是否因依赖覆盖而降级或失效。
    - 3. 通过静态扫描与配置复核确认合并运行后安全控制是否仍然有效。
    fix_suggestion: 统一版本，确保安全组件可用。同时补充最小权限、默认拒绝、输入校验、统一日志和显式审批。
    source_context:
    - OWASP Software Supply Chain Security Cheat Sheet
    - 链接：https://cheatsheetseries.owasp.org/cheatsheets/Software_Supply_Chain_Security_Cheat_Sheet.html
    - 关键上下文：Dependency Management；Version Pinning；Reproducible Builds
    - OpenSSF Secure Supply Chain Consumption Framework
    - 链接：https://openssf.org/community/ssc-framework/
    - 关键上下文：Pin and Verify Dependencies；Track Component Origins
    detection:
      type: capability_chain
      include_globs: *id001
      signals:
        dependency:
        - package\.json
        - requirements
        - go\.mod
        - pom\.xml
        tool:
        - tool
        - plugin
        - mcp
        - invoke
      pass_if: any_signal_missing
      reason: 多技能仓库中出现多套依赖定义与加载信号时需要判定依赖冲突风险
    pass_condition: any_signal_missing
    on_fail:
      action: block
      reason: 未通过静态规则：检查依赖覆盖是否导致安全功能失效
- id: S3-G06
  category: 组合信任边界
  enforcement_mapping:
    high: block_or_require_explicit_approval
    medium: require_review
    low: record_and_pass
  items:
  - id: S3-06-001
    item: 检查低可信技能是否可直接驱动高权限技能
    stage: 设计阶段
    risk_personal: 高
    risk_nonpersonal: 高
    detection_target: 检测低可信技能是否可直接驱动高权限技能，重点核查技能间调用方向、信任边界和高权限调用门槛。
    detection_method: 静态组合链路分析+人工复核。原因：组合风险取决于多个技能声明、输入输出关系和控制边界的静态可达路径，应通过静态链路分析判断。
    verification_steps:
    - 1. 盘点低可信技能到高权限技能的调用路径。
    - 2. 检查高权限技能是否只接受受信任来源、审批令牌或人工确认后的调用。
    - 3. 通过静态扫描与配置复核确认低可信技能是否可直接触发高权限动作。
    fix_suggestion: 禁止低信任→高权限直通，增加鉴权。同时补充最小权限、默认拒绝、输入校验、统一日志和显式审批。
    source_context:
    - OWASP AI Agent Security Cheat Sheet
    - 链接：https://cheatsheetseries.owasp.org/cheatsheets/AI_Agent_Security_Cheat_Sheet.html
    - 关键上下文：Least Privilege；Multi-Agent Environment；Tool Security & Least Privilege
    detection:
      type: capability_chain
      include_globs: *id001
      signals:
        tool:
        - tool
        - plugin
        - mcp
        - invoke
        privilege:
        - sudo
        - setuid
        - admin
        - root
        exec:
        - os\.system
        - subprocess
        - exec\(
        - spawn\(
        - Runtime\.getRuntime
        - ProcessBuilder
        - system\(
        - passthru\(
        - shell_exec\(
        - execSync\(
        - child_process
        - Start-Process
        - CreateProcess
        - ShellExecute
        - cmd\.exe
        - powershell\.exe
        - Runtime\.exec
        - os\/exec
        - Command\(
        - proc_open\(
      pass_if: any_signal_missing
      reason: 低可信调用信号与高权限能力同时存在时视为具备信任降级组合潜力
    pass_condition: any_signal_missing
    on_fail:
      action: block
      reason: 未通过静态规则：检查低可信技能是否可直接驱动高权限技能
- id: S3-G07
  category: 组合统一审计与溯源能力
  enforcement_mapping:
    high: block_or_require_explicit_approval
    medium: require_review
    low: record_and_pass
  items:
  - id: S3-07-001
    item: 检查组合链路是否缺少统一 trace 和审计事件
    stage: 设计阶段
    risk_personal: /
    risk_nonpersonal: 中
    detection_target: 检测多技能组合链是否缺少统一 trace 和审计事件，重点核查跨技能调用能否被同一链路 ID、同一审计事件集合完整串联。
    detection_method: 静态组合链路分析+人工复核。原因：组合风险取决于多个技能声明、输入输出关系和控制边界的静态可达路径，应通过静态链路分析判断。
    verification_steps:
    - 1. 检查跨技能调用是否传递统一 trace ID、调用 ID 或任务 ID。
    - 2. 核对审计事件是否覆盖技能选择、参数传递、审批结果和关键动作。
    - 3. 抽样复核一条组合链是否能被完整追溯。
    fix_suggestion: 打通日志，全链路traceid追踪。同时补充最小权限、默认拒绝、输入校验、统一日志和显式审批。
    source_context:
    - NIST AI Risk Management Framework
    - 链接：https://www.nist.gov/itl/ai-risk-management-framework
    - 关键上下文：Measure；Manage
    - OWASP AI Agent Security Cheat Sheet
    - 链接：https://cheatsheetseries.owasp.org/cheatsheets/AI_Agent_Security_Cheat_Sheet.html
    - 关键上下文：Monitoring and Logging；Human-in-the-Loop Controls
    detection:
      type: require_pattern
      include_globs: *id003
      patterns:
      - trace[_-]?id
      - audit
      - security[_-]?event
      pass_if: match_found
      reason: 必须发现控制证据才判定通过
    pass_condition: match_found
    on_fail:
      action: require_review
      reason: 未通过静态规则：检查组合链路是否缺少统一 trace 和审计事件
- id: S3-G08
  category: 组合执行一致性
  enforcement_mapping:
    high: block_or_require_explicit_approval
    medium: require_review
    low: record_and_pass
  items:
  - id: S3-08-001
    item: 检查重试或回调是否会触发重复高危操作
    stage: 设计阶段
    risk_personal: 中
    risk_nonpersonal: 高
    detection_target: 检测重试、回调或补偿逻辑在多技能组合下是否会重复触发高危操作，重点核查失败后重复外发、重复执行或重复写入。
    detection_method: 静态组合链路分析+人工复核。原因：组合风险取决于多个技能声明、输入输出关系和控制边界的静态可达路径，应通过静态链路分析判断。
    verification_steps:
    - 1. 识别组合链中的重试、回调、补偿和异步重放逻辑。
    - 2. 检查这些机制是否具备幂等控制、去重标记或人工确认。
    - 3. 通过静态扫描与配置复核确认失败重试后是否会重复执行高危动作。
    fix_suggestion: 幂等化改造，状态一致性校验。同时补充最小权限、默认拒绝、输入校验、统一日志和显式审批。
    source_context:
    - NIST AI Risk Management Framework
    - 链接：https://www.nist.gov/itl/ai-risk-management-framework
    - 关键上下文：Measure；Manage
    - OWASP AI Agent Security Cheat Sheet
    - 链接：https://cheatsheetseries.owasp.org/cheatsheets/AI_Agent_Security_Cheat_Sheet.html
    - 关键上下文：Monitoring and Logging；Human-in-the-Loop Controls
    detection:
      type: capability_chain
      include_globs: *id001
      signals:
        retry:
        - retry
        - callback
        - requeue
        - fallback
        exec:
        - os\.system
        - subprocess
        - exec\(
        - spawn\(
        - Runtime\.getRuntime
        - ProcessBuilder
        - system\(
        - passthru\(
        - shell_exec\(
        - execSync\(
        - child_process
        - Start-Process
        - CreateProcess
        - ShellExecute
        - cmd\.exe
        - powershell\.exe
        - Runtime\.exec
        - os\/exec
        - Command\(
        - proc_open\(
      pass_if: any_signal_missing
      reason: 重试/回调信号与高危动作同时存在时视为具备重复执行潜力
    pass_condition: any_signal_missing
    on_fail:
      action: block
      reason: 未通过静态规则：检查重试或回调是否会触发重复高危操作
  - id: S3-08-002
    item: 检查异步回调时序是否导致权限或状态错乱
    stage: 设计阶段
    risk_personal: 中
    risk_nonpersonal: 高
    detection_target: 检测异步回调时序在多技能组合下是否会导致权限或状态错乱，重点核查旧状态、过期授权或错误顺序是否会被后续技能继续使用。
    detection_method: 静态组合链路分析+人工复核。原因：组合风险取决于多个技能声明、输入输出关系和控制边界的静态可达路径，应通过静态链路分析判断。
    verification_steps:
    - 1. 盘点异步回调、状态更新和权限变更涉及的关键字段。
    - 2. 检查状态切换是否具备版本号、幂等键或过期校验。
    - 3. 在隔离环境模拟乱序回调，验证后续技能是否会基于错误状态继续执行。
    fix_suggestion: 引入状态机，确保有序执行。同时补充最小权限、默认拒绝、输入校验、统一日志和显式审批。
    source_context:
    - NIST AI Risk Management Framework
    - 链接：https://www.nist.gov/itl/ai-risk-management-framework
    - 关键上下文：Measure；Manage
    - OWASP AI Agent Security Cheat Sheet
    - 链接：https://cheatsheetseries.owasp.org/cheatsheets/AI_Agent_Security_Cheat_Sheet.html
    - 关键上下文：Monitoring and Logging；Human-in-the-Loop Controls
    detection:
      type: capability_chain
      include_globs: *id001
      signals:
        retry:
        - retry
        - callback
        - requeue
        - fallback
        state:
        - status
        - state
        - version
        - lock
      pass_if: any_signal_missing
      reason: 异步重试与状态切换信号同时存在时视为具备时序错乱潜力
    pass_condition: any_signal_missing
    on_fail:
      action: block
      reason: 未通过静态规则：检查异步回调时序是否导致权限或状态错乱
- id: S3-G09
  category: 组合审批断裂风险
  enforcement_mapping:
    high: block_or_require_explicit_approval
    medium: require_review
    low: record_and_pass
  items:
  - id: S3-09-001
    item: 检查组合链路是否可绕过整体审批直接执行
    stage: 要件阶段/设计阶段
    risk_personal: 高
    risk_nonpersonal: 高
    detection_target: 检测组合链路是否可绕过整体审批直接执行，重点核查 AI 或用户是否能通过拆步调用、路径变体或回退流程避开整链审批。
    detection_method: 静态组合链路分析+人工复核。原因：组合风险取决于多个技能声明、输入输出关系和控制边界的静态可达路径，应通过静态链路分析判断。
    verification_steps:
    - 1. 列出高危组合链的整体审批入口和覆盖范围。
    - 2. 检查是否存在拆步调用、替代技能、回退流程或参数变体可绕过整体审批。
    - 3. 通过静态扫描与配置复核确认未通过整体审批时，是否仍可分段完成整条链路。
    fix_suggestion: 全链路审批，拒绝即终止。同时补充最小权限、默认拒绝、输入校验、统一日志和显式审批。
    source_context:
    - OWASP AI Agent Security Cheat Sheet
    - 链接：https://cheatsheetseries.owasp.org/cheatsheets/AI_Agent_Security_Cheat_Sheet.html
    - 关键上下文：Human-in-the-Loop Controls；Tool Security & Least Privilege
    - NIST AI Risk Management Framework
    - 链接：https://www.nist.gov/itl/ai-risk-management-framework
    - 关键上下文：Govern；Manage
    detection:
      type: require_pattern
      include_globs: *id003
      patterns:
      - confirm
      - approval
      - approve
      - user_confirm
      pass_if: match_found
      reason: 必须发现控制证据才判定通过
    pass_condition: match_found
    on_fail:
      action: block
      reason: 未通过静态规则：检查组合链路是否可绕过整体审批直接执行
  - id: S3-09-002
    item: 检查分段审批是否可替代整体风险审批
    stage: 要件阶段/设计阶段
    risk_personal: /
    risk_nonpersonal: 高
    detection_target: 检测项目是否错误地把分段审批当作整体风险审批的替代，重点核查单步放行后是否仍缺少对组合后总风险的单独判断。
    detection_method: 静态组合链路分析+人工复核。原因：组合风险取决于多个技能声明、输入输出关系和控制边界的静态可达路径，应通过静态链路分析判断。
    verification_steps:
    - 1. 盘点高危组合链上的每个分段审批点。
    - 2. 检查系统是否在全部分段通过后，仍会对整条链进行一次总体风险判断。
    - 3. 演练分段审批全部通过的情况，验证是否仍可能缺少整体审批。
    fix_suggestion: 禁止分段审批，必须整体评估。同时补充最小权限、默认拒绝、输入校验、统一日志和显式审批。
    source_context:
    - OWASP AI Agent Security Cheat Sheet
    - 链接：https://cheatsheetseries.owasp.org/cheatsheets/AI_Agent_Security_Cheat_Sheet.html
    - 关键上下文：Human-in-the-Loop Controls；Tool Security & Least Privilege
    - NIST AI Risk Management Framework
    - 链接：https://www.nist.gov/itl/ai-risk-management-framework
    - 关键上下文：Govern；Manage
    detection:
      type: require_pattern
      include_globs: *id003
      patterns:
      - confirm
      - approval
      - approve
      - user_confirm
      pass_if: match_found
      reason: 必须发现控制证据才判定通过
    pass_condition: match_found
    on_fail:
      action: block
      reason: 未通过静态规则：检查分段审批是否可替代整体风险审批
- id: S3-G10
  category: 扩展组合风险
  enforcement_mapping:
    high: block_or_require_explicit_approval
    medium: require_review
    low: record_and_pass
  items:
  - id: S3-10-001
    item: 检查文件读取结果是否可被直接外发
    stage: 设计阶段
    risk_personal: 高
    risk_nonpersonal: 高
    detection_target: 检测文件读取结果在多技能组合后是否可被外联技能直接发送出去，重点核查文件读取输出到网络请求之间是否存在无隔离直通链。
    detection_method: 静态组合链路分析+人工复核。原因：组合风险取决于多个技能声明、输入输出关系和控制边界的静态可达路径，应通过静态链路分析判断。
    verification_steps:
    - 1. 识别文件读取类技能和外联类技能组成的最小链路。
    - 2. 检查读取结果进入外联请求前是否有脱敏、白名单或人工确认。
    - 3. 通过静态扫描与配置复核确认读取到的文件内容是否可被直接外发。
    fix_suggestion: 隔离读取与网络，增加脱敏与审批。同时补充最小权限、默认拒绝、输入校验、统一日志和显式审批。
    source_context:
    - OWASP Top 10 for LLM Applications - LLM06 Sensitive Information Disclosure
    - 链接：https://genai.owasp.org/llm-top-10/llm06-sensitive-information-disclosure/
    - 关键上下文：Description；Example Attack Scenarios；Prevention and Mitigation
    - OWASP AI Agent Security Cheat Sheet
    - 链接：https://cheatsheetseries.owasp.org/cheatsheets/AI_Agent_Security_Cheat_Sheet.html
    - 关键上下文：Multi-Agent Environment；Tool Security & Least Privilege
    detection:
      type: capability_chain
      include_globs: *id001
      signals:
        file_read:
        - readFile
        - open\(
        - fs\.read
        - cat\s+
        - glob
        - Files\.read
        - FileInputStream
        - ioutil\.ReadFile
        - os\.ReadFile
        - Storage\:\:get
        - file_get_contents
        - fopen\(
        - ReadAllText
        - ReadAllBytes
        - CopyTo\(
        network:
        - requests\.
        - httpx\.
        - fetch\(
        - axios
        - webhook
        - socket
        - HttpClient
        - RestTemplate
        - WebClient
        - URLSession
        - OkHttp
        - GuzzleHttp
        - net\/http
        - curl_exec
        - file_get_contents\(.+https?://
        - socket_connect
        - ws://
        - wss://
      pass_if: any_signal_missing
      reason: 文件读取与外联信号同时存在时视为具备直接外发潜力
    pass_condition: any_signal_missing
    on_fail:
      action: block
      reason: 未通过静态规则：检查文件读取结果是否可被直接外发
  - id: S3-10-002
    item: 检查常驻机制是否可与外联能力形成回连链
    stage: 设计阶段
    risk_personal: 中
    risk_nonpersonal: 高
    detection_target: 检测常驻任务、自启动机制或长期运行能力是否可与外联技能组合形成持续回连链，重点核查常驻状态和外部通信之间的联动。
    detection_method: 静态组合链路分析+人工复核。原因：组合风险取决于多个技能声明、输入输出关系和控制边界的静态可达路径，应通过静态链路分析判断。
    verification_steps:
    - 1. 盘点常驻进程、计划任务、自启动和心跳类技能。
    - 2. 检查这些能力是否可与外联技能组合形成持续向外连接或轮询回连。
    - 3. 通过静态扫描与配置复核确认启动后是否会自动建立持续外联链。
    fix_suggestion: 移除持久化，阻断回连。同时补充最小权限、默认拒绝、输入校验、统一日志和显式审批。
    source_context:
    - OWASP AI Agent Security Cheat Sheet
    - 链接：https://cheatsheetseries.owasp.org/cheatsheets/AI_Agent_Security_Cheat_Sheet.html
    - 关键上下文：Plan-then-Execute；Human-in-the-Loop Controls；Multi-Agent Environment
    - NIST AI Risk Management Framework
    - 链接：https://www.nist.gov/itl/ai-risk-management-framework
    - 关键上下文：Map；Measure；Manage
    detection:
      type: capability_chain
      include_globs: *id001
      signals:
        persistence:
        - crontab
        - systemd
        - autostart
        - while\s+true
        network:
        - requests\.
        - httpx\.
        - fetch\(
        - axios
        - webhook
        - socket
        - HttpClient
        - RestTemplate
        - WebClient
        - URLSession
        - OkHttp
        - GuzzleHttp
        - net\/http
        - curl_exec
        - file_get_contents\(.+https?://
        - socket_connect
        - ws://
        - wss://
      pass_if: any_signal_missing
      reason: 常驻与外联信号同时存在时视为具备持续回连潜力
    pass_condition: any_signal_missing
    on_fail:
      action: block
      reason: 未通过静态规则：检查常驻机制是否可与外联能力形成回连链
  - id: S3-10-003
    item: 检查特权能力是否可与执行能力形成高权限命令链
    stage: 设计阶段
    risk_personal: 高
    risk_nonpersonal: 高
    detection_target: 检测特权能力是否可与执行能力组合形成高权限命令链，重点核查提权步骤和命令执行步骤是否可无阻断串联。
    detection_method: 静态组合链路分析+人工复核。原因：组合风险取决于多个技能声明、输入输出关系和控制边界的静态可达路径，应通过静态链路分析判断。
    verification_steps:
    - 1. 识别具备提权、敏感操作或高权限上下文的技能，以及执行类技能。
    - 2. 检查执行动作前是否存在权限降级、人工确认或强制隔离。
    - 3. 通过静态扫描与配置复核确认是否可经组合链完成高权限命令执行。
    fix_suggestion: 隔离特权与执行，最小权限运行。同时补充最小权限、默认拒绝、输入校验、统一日志和显式审批。
    source_context:
    - OWASP AI Agent Security Cheat Sheet
    - 链接：https://cheatsheetseries.owasp.org/cheatsheets/AI_Agent_Security_Cheat_Sheet.html
    - 关键上下文：Multi-Agent Environment；Tool Security & Least Privilege；Human-in-the-Loop Controls
    - NIST AI Risk Management Framework
    - 链接：https://www.nist.gov/itl/ai-risk-management-framework
    - 关键上下文：Map；Measure；Manage
    detection:
      type: capability_chain
      include_globs: *id001
      signals:
        privilege:
        - sudo
        - setuid
        - admin
        - root
        exec:
        - os\.system
        - subprocess
        - exec\(
        - spawn\(
        - Runtime\.getRuntime
        - ProcessBuilder
        - system\(
        - passthru\(
        - shell_exec\(
        - execSync\(
        - child_process
        - Start-Process
        - CreateProcess
        - ShellExecute
        - cmd\.exe
        - powershell\.exe
        - Runtime\.exec
        - os\/exec
        - Command\(
        - proc_open\(
      pass_if: any_signal_missing
      reason: 特权与执行信号同时存在时视为具备高权限命令链潜力
    pass_condition: any_signal_missing
    on_fail:
      action: block
      reason: 未通过静态规则：检查特权能力是否可与执行能力形成高权限命令链
  - id: S3-10-004
    item: 检查数据采集结果是否可被批量外发
    stage: 设计阶段
    risk_personal: 高
    risk_nonpersonal: 高
    detection_target: 检测数据采集结果在多技能组合后是否可被批量外发，重点核查采集、汇聚和传输能力之间的连续链路。
    detection_method: 静态组合链路分析+人工复核。原因：组合风险取决于多个技能声明、输入输出关系和控制边界的静态可达路径，应通过静态链路分析判断。
    verification_steps:
    - 1. 识别数据采集、汇聚和外联技能构成的最小链路。
    - 2. 检查采集结果进入外联前是否存在脱敏、总量限制或人工确认。
    - 3. 通过静态扫描与配置复核确认批量采集结果是否可被直接外发。
    fix_suggestion: 采集授权，脱敏，出站审计。同时补充最小权限、默认拒绝、输入校验、统一日志和显式审批。
    source_context:
    - OWASP Top 10 for LLM Applications - LLM06 Sensitive Information Disclosure
    - 链接：https://genai.owasp.org/llm-top-10/llm06-sensitive-information-disclosure/
    - 关键上下文：Description；Example Attack Scenarios；Prevention and Mitigation
    - OWASP AI Agent Security Cheat Sheet
    - 链接：https://cheatsheetseries.owasp.org/cheatsheets/AI_Agent_Security_Cheat_Sheet.html
    - 关键上下文：Multi-Agent Environment；Tool Security & Least Privilege
    detection:
      type: capability_chain
      include_globs: *id001
      signals:
        collection:
        - collect
        - track\(
        - scrape
        - batch
        network:
        - requests\.
        - httpx\.
        - fetch\(
        - axios
        - webhook
        - socket
        - HttpClient
        - RestTemplate
        - WebClient
        - URLSession
        - OkHttp
        - GuzzleHttp
        - net\/http
        - curl_exec
        - file_get_contents\(.+https?://
        - socket_connect
        - ws://
        - wss://
      pass_if: any_signal_missing
      reason: 批量采集与外联信号同时存在时视为具备批量外发潜力
    pass_condition: any_signal_missing
    on_fail:
      action: block
      reason: 未通过静态规则：检查数据采集结果是否可被批量外发
  - id: S3-10-005
    item: 检查工具调用是否可间接读取并输出敏感数据
    stage: 设计阶段
    risk_personal: 中
    risk_nonpersonal: 高
    detection_target: 检测工具调用是否可通过多个技能的组合间接读取并输出敏感数据，重点核查低风险工具经组合后是否获得更高数据可见性。
    detection_method: 静态组合链路分析+人工复核。原因：组合风险取决于多个技能声明、输入输出关系和控制边界的静态可达路径，应通过静态链路分析判断。
    verification_steps:
    - 1. 盘点工具调用链中每一步的输入、输出和数据权限。
    - 2. 检查低风险工具是否可借助其他技能间接接触敏感数据。
    - 3. 通过静态扫描与配置复核确认组合调用后是否能输出本不应暴露的敏感结果。
    fix_suggestion: 工具权限隔离，敏感数据单独授权。同时补充最小权限、默认拒绝、输入校验、统一日志和显式审批。
    source_context:
    - OWASP Top 10 for LLM Applications - LLM06 Sensitive Information Disclosure
    - 链接：https://genai.owasp.org/llm-top-10/llm06-sensitive-information-disclosure/
    - 关键上下文：Description；Example Attack Scenarios；Prevention and Mitigation
    - OWASP AI Agent Security Cheat Sheet
    - 链接：https://cheatsheetseries.owasp.org/cheatsheets/AI_Agent_Security_Cheat_Sheet.html
    - 关键上下文：Multi-Agent Environment；Tool Security & Least Privilege
    detection:
      type: capability_chain
      include_globs: *id001
      signals:
        tool:
        - tool
        - plugin
        - mcp
        - invoke
        sensitive_read:
        - /etc/
        - secret
        - token
        - credential
        - password
      pass_if: any_signal_missing
      reason: 工具调用与敏感读取信号同时存在时视为具备间接敏感数据链潜力
    pass_condition: any_signal_missing
    on_fail:
      action: block
      reason: 未通过静态规则：检查工具调用是否可间接读取并输出敏感数据
  - id: S3-10-006
    item: 检查文件读写组合是否可造成数据篡改与扩散
    stage: 设计阶段
    risk_personal: 中
    risk_nonpersonal: 高
    detection_target: 检测文件读写技能组合后是否可造成数据篡改与扩散，重点核查一个技能读取到的内容是否会被另一个技能批量改写并扩散到更多路径。
    detection_method: 静态组合链路分析+人工复核。原因：组合风险取决于多个技能声明、输入输出关系和控制边界的静态可达路径，应通过静态链路分析判断。
    verification_steps:
    - 1. 盘点读取、修改、复制和批量写入技能构成的链路。
    - 2. 检查文件修改前是否有限定路径、目标数量和人工确认。
    - 3. 通过静态扫描与配置复核确认文件读写组合是否会造成大范围篡改或扩散。
    fix_suggestion: 目录隔离，权限只读/只写分离。同时补充最小权限、默认拒绝、输入校验、统一日志和显式审批。
    source_context:
    - OWASP AI Agent Security Cheat Sheet
    - 链接：https://cheatsheetseries.owasp.org/cheatsheets/AI_Agent_Security_Cheat_Sheet.html
    - 关键上下文：Multi-Agent Environment；Tool Security & Least Privilege；Human-in-the-Loop Controls
    - NIST AI Risk Management Framework
    - 链接：https://www.nist.gov/itl/ai-risk-management-framework
    - 关键上下文：Map；Measure；Manage
    detection:
      type: capability_chain
      include_globs: *id001
      signals:
        file_read:
        - readFile
        - open\(
        - fs\.read
        - cat\s+
        - glob
        - Files\.read
        - FileInputStream
        - ioutil\.ReadFile
        - os\.ReadFile
        - Storage\:\:get
        - file_get_contents
        - fopen\(
        - ReadAllText
        - ReadAllBytes
        - CopyTo\(
        file_write:
        - writeFile
        - fs\.write
        - open\(.+["\']w
        - '>\s*[^>]'
        - touch\s+
        - Files\.write
        - Files\.copy
        - FileOutputStream
        - os\.WriteFile
        - ioutil\.WriteFile
        - SaveUploadedFile
        - transferTo\(
        - Storage\:\:put
        - file_put_contents
        - Files.copy
        - Path\.of
        - System\.IO\.File\.WriteAll
        - CopyToAsync
        - fwrite\(
      pass_if: any_signal_missing
      reason: 文件读写信号同时存在时视为具备篡改与扩散潜力
    pass_condition: any_signal_missing
    on_fail:
      action: block
      reason: 未通过静态规则：检查文件读写组合是否可造成数据篡改与扩散
  - id: S3-10-007
    item: 检查外部下载内容是否可直接写入本地路径
    stage: 设计阶段
    risk_personal: 中
    risk_nonpersonal: 高
    detection_target: 检测外部下载内容在多技能组合后是否可直接写入本地路径，重点核查外部内容获取与本地落地之间是否存在路径限制和内容校验。
    detection_method: 静态组合链路分析+人工复核。原因：组合风险取决于多个技能声明、输入输出关系和控制边界的静态可达路径，应通过静态链路分析判断。
    verification_steps:
    - 1. 识别外部下载技能和本地写入技能构成的链路。
    - 2. 检查写入前是否存在目标路径白名单、类型校验或人工确认。
    - 3. 通过静态扫描与配置复核确认外部下载内容是否可被直接写入本地关键路径。
    fix_suggestion: 限制下载来源，禁止写入可执行路径。同时补充最小权限、默认拒绝、输入校验、统一日志和显式审批。
    source_context:
    - OWASP AI Agent Security Cheat Sheet
    - 链接：https://cheatsheetseries.owasp.org/cheatsheets/AI_Agent_Security_Cheat_Sheet.html
    - 关键上下文：Tool Security & Least Privilege；Multi-Agent Environment
    - OWASP Software Supply Chain Security Cheat Sheet
    - 链接：https://cheatsheetseries.owasp.org/cheatsheets/Software_Supply_Chain_Security_Cheat_Sheet.html
    - 关键上下文：Verify Integrity；Use Trusted Sources；Artifact Signing
    detection:
      type: capability_chain
      include_globs: *id001
      signals:
        download:
        - curl
        - wget
        - Invoke-WebRequest
        - download
        - wget\s+
        - curl\s+-O
        - Invoke-RestMethod
        - WebClient\.DownloadFile
        - HttpClient\.GetAsync
        - http\.Get\(
        - axios\.get
        - requests\.get
        - urllib\.request
        - downloadFile
        - DownloadString
        - fetch\(
        file_write:
        - writeFile
        - fs\.write
        - open\(.+["\']w
        - '>\s*[^>]'
        - touch\s+
        - Files\.write
        - Files\.copy
        - FileOutputStream
        - os\.WriteFile
        - ioutil\.WriteFile
        - SaveUploadedFile
        - transferTo\(
        - Storage\:\:put
        - file_put_contents
        - Files.copy
        - Path\.of
        - System\.IO\.File\.WriteAll
        - CopyToAsync
        - fwrite\(
      pass_if: any_signal_missing
      reason: 下载与写入信号同时存在时视为具备外部内容落地潜力
    pass_condition: any_signal_missing
    on_fail:
      action: block
      reason: 未通过静态规则：检查外部下载内容是否可直接写入本地路径
- id: S3-G11
  category: 项目级组合边界
  enforcement_mapping:
    high: block_or_require_explicit_approval
    medium: require_review
    low: record_and_pass
  items:
  - id: S3-11-001
    item: 检查项目组启用的技能集合是否定义了组合级最小权限清单
    stage: 设计阶段
    risk_personal: /
    risk_nonpersonal: 中
    detection_target: 检测项目组启用的技能集合是否有明确的组合级最小权限范围，重点核查项目启用清单、权限矩阵和默认关闭策略。
    detection_method: 静态组合链路分析+编排策略审查。原因：这类问题需要结合 AI 的自动选技、上下文传递和失败回退策略做静态审查，判断是否存在高风险编排路径。
    verification_steps:
    - 1. 列出项目中实际开放给 AI 的全部技能及其权限。
    - 2. 检查是否存在项目级最小权限清单，而不是默认开放全部技能。
    - 3. 复核项目启用范围是否与业务目标一致。
    fix_suggestion: 为项目建立组合级最小权限清单；默认仅开放当前项目明确需要的技能和权限。
    source_context:
    - OWASP AI Agent Security Cheat Sheet
    - 链接：https://cheatsheetseries.owasp.org/cheatsheets/AI_Agent_Security_Cheat_Sheet.html
    - 关键上下文：Least Privilege；Multi-Agent Environment；Human-in-the-Loop Controls
    - NIST AI Risk Management Framework
    - 链接：https://www.nist.gov/itl/ai-risk-management-framework
    - 关键上下文：Govern；Map；Manage
    detection:
      type: require_pattern
      include_globs: *id003
      patterns:
      - allowlist
      - denylist
      - policy
      - capability
      - confirm
      - approval
      - approve
      - user_confirm
      pass_if: match_found
      reason: 必须发现控制证据才判定通过
    pass_condition: match_found
    on_fail:
      action: require_review
      reason: 未通过静态规则：检查项目组启用的技能集合是否定义了组合级最小权限清单
  - id: S3-11-002
    item: 检查项目组是否定义了允许组合和禁止组合的技能边界
    stage: 设计阶段
    risk_personal: /
    risk_nonpersonal: 高
    detection_target: 检测项目是否明确规定哪些技能可以组合、哪些技能禁止组合，重点核查组合白名单、黑名单和边界策略。
    detection_method: 静态组合链路分析+编排策略审查。原因：这类问题需要结合 AI 的自动选技、上下文传递和失败回退策略做静态审查，判断是否存在高风险编排路径。
    verification_steps:
    - 1. 检查项目技能配置、策略文件或说明文档中是否定义组合白名单和禁止组合。
    - 2. 识别高风险链路是否被显式列为禁止组合。
    - 3. 验证 AI 在运行时是否会受到这些边界限制。
    fix_suggestion: 为项目建立允许组合和禁止组合清单；对高风险组合实施默认禁止策略。
    source_context:
    - OWASP AI Agent Security Cheat Sheet
    - 链接：https://cheatsheetseries.owasp.org/cheatsheets/AI_Agent_Security_Cheat_Sheet.html
    - 关键上下文：Least Privilege；Multi-Agent Environment；Human-in-the-Loop Controls
    - NIST AI Risk Management Framework
    - 链接：https://www.nist.gov/itl/ai-risk-management-framework
    - 关键上下文：Govern；Map；Manage
    detection:
      type: require_pattern
      include_globs: *id003
      patterns:
      - allowlist
      - denylist
      - policy
      - capability
      - confirm
      - approval
      - approve
      - user_confirm
      pass_if: match_found
      reason: 必须发现控制证据才判定通过
    pass_condition: match_found
    on_fail:
      action: block
      reason: 未通过静态规则：检查项目组是否定义了允许组合和禁止组合的技能边界
  - id: S3-11-003
    item: 检查项目组是否为高风险技能组合设置统一审批和统一审计
    stage: 要件阶段/设计阶段
    risk_personal: /
    risk_nonpersonal: 高
    detection_target: 检测项目是否对高风险技能组合设置统一审批与统一审计，而不是由单个技能各自独立处理。
    detection_method: 静态组合链路分析+编排策略审查。原因：这类问题需要结合 AI 的自动选技、上下文传递和失败回退策略做静态审查，判断是否存在高风险编排路径。
    verification_steps:
    - 1. 检查项目级配置中是否存在统一审批入口和统一审计规则。
    - 2. 验证高风险组合执行时是否会触发项目级审批和审计，而不是仅依赖单技能局部控制。
    - 3. 抽样检查审计记录是否能覆盖完整组合链路。
    fix_suggestion: 将高风险组合的审批和审计上升到项目级统一控制；避免由单个技能分散承担。
    source_context:
    - OWASP AI Agent Security Cheat Sheet
    - 链接：https://cheatsheetseries.owasp.org/cheatsheets/AI_Agent_Security_Cheat_Sheet.html
    - 关键上下文：Least Privilege；Multi-Agent Environment；Human-in-the-Loop Controls
    - NIST AI Risk Management Framework
    - 链接：https://www.nist.gov/itl/ai-risk-management-framework
    - 关键上下文：Govern；Map；Manage
    detection:
      type: require_pattern
      include_globs: *id003
      patterns:
      - allowlist
      - denylist
      - policy
      - capability
      - confirm
      - approval
      - approve
      - user_confirm
      pass_if: match_found
      reason: 必须发现控制证据才判定通过
    pass_condition: match_found
    on_fail:
