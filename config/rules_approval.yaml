    - 2. 审查项目配置是否默认关闭执行能力，并在必要时按需启用。
    - 3. 验证低风险场景下 AI 是否仍能调用命令执行技能。
    fix_suggestion: 按最小必要裁剪权限。同时补充最小权限、默认拒绝、输入校验、统一日志和显式审批。
    source_context:
    - OWASP AI Agent Security Cheat Sheet
    - 链接：https://cheatsheetseries.owasp.org/cheatsheets/AI_Agent_Security_Cheat_Sheet.html
    - 关键上下文：Least Privilege；Multi-Agent Environment；Tool Security & Least Privilege
    detection:
      type: require_pattern
      include_globs: *id003
      patterns:
      - disable_exec
      - enable_exec
      - feature[_-]?flag
      - capability[_-]?policy
      pass_if: match_found
      reason: 必须发现控制证据才判定通过
    pass_condition: match_found
    on_fail:
      action: block
      reason: 未通过静态规则：检查命令执行能力是否支持按场景关闭
  - id: S3-01-015
    item: 检查外联能力是否支持按场景关闭
    stage: 设计阶段
    risk_personal: 中
    risk_nonpersonal: 高
    detection_target: 检测项目在多技能环境中是否可按场景关闭外联能力，重点核查网络技能是否支持按任务、环境或流程裁剪。
    detection_method: 静态组合链路分析+人工复核。原因：组合风险取决于多个技能声明、输入输出关系和控制边界的静态可达路径，应通过静态链路分析判断。
