      reason: 未通过静态规则：检查项目组是否为高风险技能组合设置统一审批和统一审计
  - id: S3-11-004
    item: 检查项目组是否按场景裁剪技能集合而不是全量开放给 AI
    stage: 设计阶段
    risk_personal: /
    risk_nonpersonal: 中
    detection_target: 检测项目是否按任务场景裁剪技能集合，而不是把仓库中全部可用技能统一开放给 AI。
    detection_method: 静态组合链路分析+编排策略审查。原因：这类问题需要结合 AI 的自动选技、上下文传递和失败回退策略做静态审查，判断是否存在高风险编排路径。
    verification_steps:
    - 1. 盘点项目当前实际开放给 AI 的技能集合。
    - 2. 判断其中哪些技能与当前项目目标无关但仍被开放。
    - 3. 检查是否存在按场景、按流程、按环境裁剪技能集合的机制。
    fix_suggestion: 将技能开放策略改为按项目场景裁剪；默认不向 AI 暴露与当前项目无关的技能。
    source_context:
    - OWASP AI Agent Security Cheat Sheet
    - 链接：https://cheatsheetseries.owasp.org/cheatsheets/AI_Agent_Security_Cheat_Sheet.html
    - 关键上下文：Least Privilege；Multi-Agent Environment；Human-in-the-Loop Controls
    - NIST AI Risk Management Framework
    - 链接：https://www.nist.gov/itl/ai-risk-management-framework
    - 关键上下文：Govern；Map；Manage
    detection:
      type: require_pattern
      include_globs: *id003
      patterns:
      - allowlist
      - denylist
      - policy
      - capability
      - confirm
      - approval
      - approve
      - user_confirm
      pass_if: match_found
      reason: 必须发现控制证据才判定通过
    pass_condition: match_found
    on_fail:
