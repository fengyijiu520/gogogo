      type: capability_chain
      include_globs: *id001
      signals:
        injection:
        - \+.+input
        - f["\"][^"\n]*\{.+\}
        - template.+input
        file_write:
        - writeFile
        - fs\.write
        - open\(.+["\']w
        - '>\s*[^>]'
        - touch\s+
        - Files\.write
        - Files\.copy
        - FileOutputStream
        - os\.WriteFile
        - ioutil\.WriteFile
        - SaveUploadedFile
        - transferTo\(
        - Storage\:\:put
        - file_put_contents
        - Files.copy
        - Path\.of
        - System\.IO\.File\.WriteAll
        - CopyToAsync
        - fwrite\(
      pass_if: any_signal_missing
      reason: 注入信号与文件写入信号同时存在时视为具备越权读写组合潜力
    pass_condition: any_signal_missing
    on_fail:
      action: block
      reason: 未通过静态规则：检查注入漏洞是否可驱动越权文件读写
  - id: S3-05-004
    item: 检查注入与越权读写组合后是否可进入执行链路
    stage: 设计阶段
    risk_personal: 高
    risk_nonpersonal: 高
    detection_target: 检测注入问题与越权读写能力组合后是否可继续进入执行链路，重点核查从输入控制到写入落地再到执行的连续放大路径。
    detection_method: 静态组合链路分析+人工复核。原因：组合风险取决于多个技能声明、输入输出关系和控制边界的静态可达路径，应通过静态链路分析判断。
    verification_steps:
    - 1. 识别注入、越权读写和执行技能组成的最小组合链。
    - 2. 检查写入结果进入执行前是否存在隔离、人工确认或完整性校验。
    - 3. 通过静态扫描与配置复核确认构造输入是否可经组合链一路放大到执行动作。
    fix_suggestion: 修复输入校验，阻断执行链路。同时补充最小权限、默认拒绝、输入校验、统一日志和显式审批。
    source_context:
    - OWASP Input Validation Cheat Sheet
    - 链接：https://cheatsheetseries.owasp.org/cheatsheets/Input_Validation_Cheat_Sheet.html
    - 关键上下文：Goals of Input Validation；Implementing Input Validation
    - OWASP AI Agent Security Cheat Sheet
    - 链接：https://cheatsheetseries.owasp.org/cheatsheets/AI_Agent_Security_Cheat_Sheet.html
    - 关键上下文：Tool Security & Least Privilege；Multi-Agent Environment
    detection:
      type: capability_chain
      include_globs: *id001
      signals:
        injection:
        - \+.+input
        - f["\"][^"\n]*\{.+\}
        - template.+input
        file_write:
