        - file_get_contents
        - fopen\(
        - ReadAllText
        - ReadAllBytes
        - CopyTo\(
        ssrf:
        - 169\.254\.169\.254
        - localhost
        - 127\.0\.0\.1
        - allow_redirects
        network:
        - requests\.
        - httpx\.
        - fetch\(
        - axios
