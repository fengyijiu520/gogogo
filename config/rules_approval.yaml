  items:
  - id: S3-04-001
    item: 检查多技能是否通过共享环境变量联动触发高危行为
    stage: 设计阶段
    risk_personal: 中
    risk_nonpersonal: 高
    detection_target: 检测多个技能是否会通过共享环境变量联动触发高危行为，重点核查一个技能写入的环境状态是否会被另一技能当作高风险动作触发条件。
    detection_method: 静态组合链路分析+人工复核。原因：组合风险取决于多个技能声明、输入输出关系和控制边界的静态可达路径，应通过静态链路分析判断。
    verification_steps:
    - 1. 盘点技能运行时共享的环境变量、进程变量和配置开关。
    - 2. 检查一个技能是否能修改这些状态，并被另一技能解释为高危动作触发条件。
    - 3. 通过静态扫描与配置复核确认环境变量变化是否可跨技能触发外联、执行或提权步骤。
    fix_suggestion: 显式声明触发条件，运行时告警拦截。同时补充最小权限、默认拒绝、输入校验、统一日志和显式审批。
    source_context:
    - MITRE CWE-912 Hidden Functionality
    - 链接：https://cwe.mitre.org/data/definitions/912.html
