        - process\.env
        - os\.environ
        exec:
        - os\.system
        - subprocess
        - exec\(
        - spawn\(
        - Runtime\.getRuntime
        - ProcessBuilder
        - system\(
        - passthru\(
        - shell_exec\(
        - execSync\(
        - child_process
        - Start-Process
        - CreateProcess
        - ShellExecute
        - cmd\.exe
        - powershell\.exe
        - Runtime\.exec
        - os\/exec
        - Command\(
        - proc_open\(
      pass_if: any_signal_missing
      reason: 环境变量控制与高风险动作信号同时存在时视为具备联动触发潜力
    pass_condition: any_signal_missing
    on_fail:
      action: block
      reason: 未通过静态规则：检查多技能是否通过共享环境变量联动触发高危行为
