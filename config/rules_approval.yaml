scene: 场景三
scope: 单个安全技能已入库后，多技能同时开放时的组合风险审查规则
source_workbook: 场景三-技能组合风险审查表.xlsx
decision_policy:
  nonpersonal_high: block_or_require_explicit_approval
  nonpersonal_medium: require_review
  nonpersonal_low: record_and_pass
  notes:
  - 规则以场景三最终评估项为准。
  - 仅对应已入库 skills 的组合风险审查。
  - 重点覆盖 AI 自动编排链、项目级组合边界、统一审批与统一审计。
rule_groups:
- id: S3-G01
  category: 组合权限聚合
  enforcement_mapping:
    high: block_or_require_explicit_approval
    medium: require_review
    low: record_and_pass
  items:
  - id: S3-01-001
    item: 检查受限目录读取结果是否可直接进入写入链路
    stage: 设计阶段
    risk_personal: 高
    risk_nonpersonal: 高
    detection_target: 检测受限目录中的读取结果在多技能组合后是否可被下游写入技能直接消费，重点核查读取输出、共享上下文和写入目标之间是否存在无隔离直通链路。
    detection_method: 静态组合链路分析+人工复核。原因：组合风险取决于多个技能声明、输入输出关系和控制边界的静态可达路径，应通过静态链路分析判断。
    verification_steps:
    - 1. 列出读取类技能输出字段、共享上下文和写入类技能输入字段，画出最小读到写组合链。
    - 2. 复核读取结果是否需要人工确认、字段过滤或路径白名单后才能进入写入步骤。
    - 3. 通过静态输入输出映射、路径约束和文档声明复核，确认读取结果是否可被直接写入到新文件、配置文件或脚本路径。
    fix_suggestion: 隔离权限，禁止低权限技能驱动高权限操作。同时补充最小权限、默认拒绝、输入校验、统一日志和显式审批。
    source_context:
    - OWASP AI Agent Security Cheat Sheet
    - 链接：https://cheatsheetseries.owasp.org/cheatsheets/AI_Agent_Security_Cheat_Sheet.html
    - 关键上下文：Multi-Agent Environment；Tool Security & Least Privilege；Human-in-the-Loop Controls
    - NIST AI Risk Management Framework
    - 链接：https://www.nist.gov/itl/ai-risk-management-framework
    - 关键上下文：Map；Measure；Manage
    detection:
      type: capability_chain
      include_globs: &id001
      - '**/*.py'
      - '**/*.js'
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.jsx'
      - '**/*.go'
      - '**/*.java'
      - '**/*.kt'
      - '**/*.kts'
      - '**/*.scala'
      - '**/*.groovy'
      - '**/*.rb'
      - '**/*.php'
      - '**/*.cs'
      - '**/*.vb'
      - '**/*.rs'
      - '**/*.c'
      - '**/*.cc'
      - '**/*.cpp'
      - '**/*.cxx'
      - '**/*.h'
      - '**/*.hpp'
      - '**/*.swift'
      - '**/*.m'
      - '**/*.mm'
      - '**/*.lua'
      - '**/*.pl'
      - '**/*.pm'
      - '**/*.r'
      - '**/*.dart'
      - '**/*.sh'
      - '**/*.bash'
      - '**/*.zsh'
      - '**/*.ps1'
      - '**/*.bat'
      - '**/*.cmd'
      - '**/*.json'
      - '**/*.yaml'
      - '**/*.yml'
      - '**/*.xml'
      - '**/*.toml'
      - '**/*.ini'
      - '**/*.conf'
      - '**/*.properties'
      - '**/*.gradle'
      - '**/*.sbt'
      - '**/*.sql'
      - '**/*.proto'
      - '**/*.env*'
      - '**/Dockerfile'
      - '**/Makefile'
      signals:
        file_read:
        - readFile
        - open\(
        - fs\.read
        - cat\s+
        - glob
        - Files\.read
        - FileInputStream
        - ioutil\.ReadFile
        - os\.ReadFile
        - Storage\:\:get
        - file_get_contents
        - fopen\(
        - ReadAllText
        - ReadAllBytes
        - CopyTo\(
        file_write:
        - writeFile
        - fs\.write
        - open\(.+["\']w
        - '>\s*[^>]'
        - touch\s+
        - Files\.write
        - Files\.copy
        - FileOutputStream
        - os\.WriteFile
        - ioutil\.WriteFile
        - SaveUploadedFile
        - transferTo\(
        - Storage\:\:put
        - file_put_contents
        - Files.copy
        - Path\.of
        - System\.IO\.File\.WriteAll
        - CopyToAsync
        - fwrite\(
      pass_if: any_signal_missing
      reason: 同时存在读取和写入信号时视为具备读到写组合潜力
    pass_condition: any_signal_missing
    on_fail:
      action: block
      reason: 未通过静态规则：检查受限目录读取结果是否可直接进入写入链路
  - id: S3-01-002
    item: 检查敏感文件读取结果是否可直接进入写入链路
    stage: 设计阶段
    risk_personal: 高
    risk_nonpersonal: 高
    detection_target: 检测敏感文件读取结果在多技能组合后是否可被写入技能直接落地到其他路径、缓存或中间文件，重点核查敏感内容是否可跨技能无约束流转。
    detection_method: 静态组合链路分析+人工复核。原因：组合风险取决于多个技能声明、输入输出关系和控制边界的静态可达路径，应通过静态链路分析判断。
    verification_steps:
    - 1. 盘点敏感文件读取能力、输出字段和写入技能的输入字段。
    - 2. 检查读取结果进入写入步骤前是否存在脱敏、裁剪、审批或目标路径限制。
    - 3. 通过静态扫描与配置复核确认敏感文件内容是否可被直接写入到工作目录、共享目录或其他可继续利用的位置。
    fix_suggestion: 隔离权限，禁止低权限技能驱动高权限操作。同时补充最小权限、默认拒绝、输入校验、统一日志和显式审批。
    source_context:
    - OWASP AI Agent Security Cheat Sheet
    - 链接：https://cheatsheetseries.owasp.org/cheatsheets/AI_Agent_Security_Cheat_Sheet.html
    - 关键上下文：Multi-Agent Environment；Tool Security & Least Privilege；Human-in-the-Loop Controls
    - NIST AI Risk Management Framework
    - 链接：https://www.nist.gov/itl/ai-risk-management-framework
    - 关键上下文：Map；Measure；Manage
    detection:
      type: capability_chain
      include_globs: *id001
      signals:
        file_read:
        - readFile
        - open\(
        - fs\.read
        - cat\s+
        - glob
        - Files\.read
        - FileInputStream
        - ioutil\.ReadFile
        - os\.ReadFile
        - Storage\:\:get
        - file_get_contents
        - fopen\(
        - ReadAllText
        - ReadAllBytes
        - CopyTo\(
        file_write:
        - writeFile
        - fs\.write
        - open\(.+["\']w
        - '>\s*[^>]'
        - touch\s+
        - Files\.write
        - Files\.copy
        - FileOutputStream
        - os\.WriteFile
        - ioutil\.WriteFile
        - SaveUploadedFile
        - transferTo\(
        - Storage\:\:put
        - file_put_contents
        - Files.copy
        - Path\.of
        - System\.IO\.File\.WriteAll
        - CopyToAsync
        - fwrite\(
      pass_if: any_signal_missing
      reason: 同时存在读取和写入信号时视为具备读到写组合潜力
    pass_condition: any_signal_missing
    on_fail:
      action: block
      reason: 未通过静态规则：检查敏感文件读取结果是否可直接进入写入链路
  - id: S3-01-003
    item: 检查写入到工作目录的文件是否可直接进入执行链路
    stage: 设计阶段
    risk_personal: 高
    risk_nonpersonal: 高
    detection_target: 检测写入到工作目录的文件在多技能组合后是否可被执行技能直接调用，重点核查工作目录写入结果到执行入口之间是否存在无审批直通链。
    detection_method: 静态组合链路分析+人工复核。原因：组合风险取决于多个技能声明、输入输出关系和控制边界的静态可达路径，应通过静态链路分析判断。
    verification_steps:
    - 1. 盘点写入类技能可落地的目录范围，以及执行类技能可读取和可执行的路径范围。
    - 2. 检查工作目录写入结果进入执行步骤前是否存在签名、人工确认或文件类型限制。
    - 3. 通过静态扫描与配置复核确认新写入文件是否可被后续执行技能直接运行。
    fix_suggestion: 隔离权限，禁止低权限技能驱动高权限操作。同时补充最小权限、默认拒绝、输入校验、统一日志和显式审批。
    source_context:
    - OWASP AI Agent Security Cheat Sheet
    - 链接：https://cheatsheetseries.owasp.org/cheatsheets/AI_Agent_Security_Cheat_Sheet.html
    - 关键上下文：Multi-Agent Environment；Tool Security & Least Privilege；Human-in-the-Loop Controls
    - NIST AI Risk Management Framework
    - 链接：https://www.nist.gov/itl/ai-risk-management-framework
    - 关键上下文：Map；Measure；Manage
    detection:
      type: capability_chain
      include_globs: *id001
      signals:
        file_write:
        - writeFile
        - fs\.write
        - open\(.+["\']w
        - '>\s*[^>]'
        - touch\s+
        - Files\.write
        - Files\.copy
        - FileOutputStream
        - os\.WriteFile
        - ioutil\.WriteFile
        - SaveUploadedFile
        - transferTo\(
        - Storage\:\:put
        - file_put_contents
        - Files.copy
        - Path\.of
        - System\.IO\.File\.WriteAll
        - CopyToAsync
        - fwrite\(
        exec:
        - os\.system
        - subprocess
        - exec\(
        - spawn\(
        - Runtime\.getRuntime
        - ProcessBuilder
        - system\(
        - passthru\(
        - shell_exec\(
        - execSync\(
        - child_process
        - Start-Process
        - CreateProcess
        - ShellExecute
        - cmd\.exe
        - powershell\.exe
        - Runtime\.exec
        - os\/exec
        - Command\(
        - proc_open\(
      pass_if: any_signal_missing
      reason: 同时存在写入和执行信号时视为具备写到执行组合潜力
    pass_condition: any_signal_missing
    on_fail:
      action: block
      reason: 未通过静态规则：检查写入到工作目录的文件是否可直接进入执行链路
  - id: S3-01-004
    item: 检查写入到脚本或可执行路径的文件是否可直接进入执行链路
    stage: 设计阶段
    risk_personal: 高
    risk_nonpersonal: 高
    detection_target: 检测写入到脚本目录或可执行路径的文件在多技能组合后是否可直接进入执行链路，重点核查高风险路径写入和执行能力的联动。
    detection_method: 静态组合链路分析+人工复核。原因：组合风险取决于多个技能声明、输入输出关系和控制边界的静态可达路径，应通过静态链路分析判断。
    verification_steps:
    - 1. 识别写入技能可覆盖的脚本路径、插件路径和可执行目录。
    - 2. 检查这些高风险路径上的新文件是否会被执行技能、任务调度或运行入口自动消费。
    - 3. 通过静态扫描与配置复核确认写入到高风险路径的文件是否可被直接执行或加载。
    fix_suggestion: 隔离权限，禁止低权限技能驱动高权限操作。同时补充最小权限、默认拒绝、输入校验、统一日志和显式审批。
    source_context:
    - OWASP AI Agent Security Cheat Sheet
    - 链接：https://cheatsheetseries.owasp.org/cheatsheets/AI_Agent_Security_Cheat_Sheet.html
    - 关键上下文：Multi-Agent Environment；Tool Security & Least Privilege；Human-in-the-Loop Controls
    - NIST AI Risk Management Framework
    - 链接：https://www.nist.gov/itl/ai-risk-management-framework
    - 关键上下文：Map；Measure；Manage
    detection:
      type: capability_chain
      include_globs: *id001
      signals:
        file_write:
        - writeFile
        - fs\.write
        - open\(.+["\']w
        - '>\s*[^>]'
        - touch\s+
        - Files\.write
        - Files\.copy
        - FileOutputStream
        - os\.WriteFile
        - ioutil\.WriteFile
        - SaveUploadedFile
        - transferTo\(
        - Storage\:\:put
        - file_put_contents
        - Files.copy
        - Path\.of
        - System\.IO\.File\.WriteAll
        - CopyToAsync
        - fwrite\(
        exec:
        - os\.system
        - subprocess
        - exec\(
        - spawn\(
        - Runtime\.getRuntime
        - ProcessBuilder
        - system\(
        - passthru\(
        - shell_exec\(
        - execSync\(
        - child_process
        - Start-Process
        - CreateProcess
        - ShellExecute
        - cmd\.exe
        - powershell\.exe
        - Runtime\.exec
        - os\/exec
        - Command\(
        - proc_open\(
      pass_if: any_signal_missing
      reason: 同时存在写入和执行信号时视为具备写到执行组合潜力
    pass_condition: any_signal_missing
    on_fail:
      action: block
      reason: 未通过静态规则：检查写入到脚本或可执行路径的文件是否可直接进入执行链路
  - id: S3-01-005
    item: 检查上传内容是否可直接进入写入或执行链路
    stage: 设计阶段
    risk_personal: 高
    risk_nonpersonal: 高
    detection_target: 检测上传能力产生的内容在多技能组合后是否可被写入技能、解压技能、解析技能或执行技能直接消费，重点核查上传输出、共享上下文、落地目录和后续执行入口之间是否存在无隔离直通链。
    detection_method: 静态组合链路分析+人工复核。原因：组合风险取决于多个技能声明、输入输出关系和控制边界的静态可达路径，应通过静态链路分析判断。
    verification_steps:
    - 1. 列出上传类技能输出字段、共享上下文、写入目录和执行入口，画出最小上传到写入或执行组合链。
    - 2. 检查上传结果进入后续技能前是否存在人工确认、类型白名单、隔离目录、重命名或审批断点。
    - 3. 通过静态输入输出映射、路径约束和文档声明复核，确认上传内容是否可被直接写入脚本路径、模板路径、插件路径或执行入口。
    fix_suggestion: 为上传技能和写入/执行技能之间增加隔离目录、人工确认、文件类型白名单和统一审批；默认阻断上传内容直接进入后续执行链。
    source_context:
    - OWASP File Upload Cheat Sheet
    - 链接：https://cheatsheetseries.owasp.org/cheatsheets/File_Upload_Cheat_Sheet.html
    - 关键上下文：File Storage Location；File Type Validation；Filesystem Permissions
    - OWASP AI Agent Security Cheat Sheet
    - 链接：https://cheatsheetseries.owasp.org/cheatsheets/AI_Agent_Security_Cheat_Sheet.html
    - 关键上下文：Multi-Agent Environment；Tool Security & Least Privilege；Human-in-the-Loop Controls
    detection:
      type: capability_chain
      include_globs: *id001
      signals:
        upload:
        - multipart/form-data
        - FormData
        - MultipartFile
        - IFormFile
        - move_uploaded_file
        - upload
        - MultipartHttpServletRequest
        - Request\.FormFile
        - SaveUploadedFile
        - c\.SaveUploadedFile
        - r\.FormFile
        - ParseMultipartForm
        - multer
        - busboy
        - express-fileupload
        - request\.files
        - \$_FILES
        - HttpPostedFileBase
        - PostedFile
        - UploadFile
        - mime/multipart
        - FastAPI\s*File\(
        - transferTo\(
        file_write:
        - writeFile
        - fs\.write
        - open\(.+["']w
        - '>\s*[^>]'
        - touch\s+
        - Files\.write
        - Files\.copy
        - FileOutputStream
        - os\.WriteFile
        - ioutil\.WriteFile
        - SaveUploadedFile
        - transferTo\(
        - Storage\:\:put
        - file_put_contents
        - Files.copy
        - Path\.of
        - System\.IO\.File\.WriteAll
        - CopyToAsync
        - fwrite\(
        exec:
        - os\.system
        - subprocess
        - exec\(
        - spawn\(
        - Runtime\.getRuntime
        - ProcessBuilder
        - system\(
        - passthru\(
        - shell_exec\(
        - execSync\(
        - child_process
        - Start-Process
        - CreateProcess
        - ShellExecute
        - cmd\.exe
        - powershell\.exe
        - Runtime\.exec
        - os\/exec
        - Command\(
        - proc_open\(
      pass_if: any_signal_missing
      reason: 同时存在上传与写入或执行信号，且缺少审批、隔离或类型校验控制时视为未通过
      control_signals:
        approval:
        - approval
        - manual_review
        - human_review
        - confirm
        - four-eyes
        isolation:
        - quarantine
        - sandbox
        - isolated
        - noexec
        - private bucket
        validation:
        - allowlist
        - whitelist
        - mime
        - magic
        - sanitize_filename
        - rename
      match_logic: chain_without_control
      fail_when: upload_signal_and_write_or_exec_signal_present_and_control_signals_missing
    pass_condition: chain_missing_or_control_present
    on_fail:
      action: block
      reason: 未通过静态规则：检查上传内容是否可直接进入写入或执行链路
  - id: S3-01-006
    item: 检查读写执行三段组合是否缺少统一审批
    stage: 要件阶段/设计阶段
    risk_personal: 高
    risk_nonpersonal: 高
    detection_target: 检测读取、写入、执行三段技能组合在项目组同时开放后是否缺少统一审批，重点核查整条链路是否只按单技能分散放行。
    detection_method: 静态组合链路分析+人工复核。原因：组合风险取决于多个技能声明、输入输出关系和控制边界的静态可达路径，应通过静态链路分析判断。
    verification_steps:
    - 1. 识别可构成读写执行闭环的最小技能组合。
    - 2. 审查组合链是否存在覆盖整条链路的统一审批，而不是读取、写入、执行分别独立放行。
    - 3. 在隔离环境演练闭环链路，验证未通过统一审批时系统是否仍可分段执行完成。
    fix_suggestion: 隔离权限，禁止低权限技能驱动高权限操作。同时补充最小权限、默认拒绝、输入校验、统一日志和显式审批。
    source_context:
    - OWASP AI Agent Security Cheat Sheet
    - 链接：https://cheatsheetseries.owasp.org/cheatsheets/AI_Agent_Security_Cheat_Sheet.html
    - 关键上下文：Human-in-the-Loop Controls；Tool Security & Least Privilege
    - NIST AI Risk Management Framework
    - 链接：https://www.nist.gov/itl/ai-risk-management-framework
    - 关键上下文：Govern；Manage
    detection:
      type: capability_chain
      include_globs: *id001
      signals:
        file_read:
        - readFile
        - open\(
        - fs\.read
        - cat\s+
        - glob
        - Files\.read
        - FileInputStream
        - ioutil\.ReadFile
        - os\.ReadFile
        - Storage\:\:get
        - file_get_contents
        - fopen\(
        - ReadAllText
        - ReadAllBytes
        - CopyTo\(
        file_write:
        - writeFile
        - fs\.write
        - open\(.+["\']w
        - '>\s*[^>]'
        - touch\s+
        - Files\.write
        - Files\.copy
        - FileOutputStream
        - os\.WriteFile
        - ioutil\.WriteFile
        - SaveUploadedFile
        - transferTo\(
        - Storage\:\:put
        - file_put_contents
        - Files.copy
        - Path\.of
        - System\.IO\.File\.WriteAll
        - CopyToAsync
        - fwrite\(
        exec:
        - os\.system
        - subprocess
        - exec\(
        - spawn\(
        - Runtime\.getRuntime
        - ProcessBuilder
        - system\(
        - passthru\(
        - shell_exec\(
        - execSync\(
        - child_process
        - Start-Process
        - CreateProcess
        - ShellExecute
        - cmd\.exe
        - powershell\.exe
        - Runtime\.exec
        - os\/exec
        - Command\(
        - proc_open\(
      pass_if: any_signal_missing
      reason: 同时存在读写执行闭环信号且缺少统一审批控制时视为未通过
      control_signals:
        approval:
        - approval
        - manual_review
        - human_review
        - confirm
        - workflow approval
        - policy gate
      match_logic: chain_without_control
      fail_when: read_write_exec_signals_present_and_control_signals_missing
    pass_condition: chain_missing_or_control_present
    on_fail:
      action: block
      reason: 未通过静态规则：检查读写执行三段组合是否缺少统一审批
  - id: S3-01-007
    item: 检查高危组合是否只做分段审批而缺少整体审批
    stage: 要件阶段/设计阶段
    risk_personal: 中
    risk_nonpersonal: 高
    detection_target: 检测高危技能组合是否仅对单步动作做分段审批，而缺少覆盖整条组合链风险的整体审批，重点核查审批对象是否从单技能升级到组合链。
    detection_method: 静态组合链路分析+人工复核。原因：组合风险取决于多个技能声明、输入输出关系和控制边界的静态可达路径，应通过静态链路分析判断。
    verification_steps:
    - 1. 列出高危组合链上的各个审批点和审批对象。
    - 2. 检查审批流程是否只覆盖单个技能动作，而未覆盖组合后的整体影响。
    - 3. 在隔离环境模拟逐步放行，验证仅通过分段审批时是否仍可完成高危组合链。
    fix_suggestion: 隔离权限，禁止低权限技能驱动高权限操作。同时补充最小权限、默认拒绝、输入校验、统一日志和显式审批。
    source_context:
    - OWASP AI Agent Security Cheat Sheet
    - 链接：https://cheatsheetseries.owasp.org/cheatsheets/AI_Agent_Security_Cheat_Sheet.html
    - 关键上下文：Human-in-the-Loop Controls；Tool Security & Least Privilege
    - NIST AI Risk Management Framework
    - 链接：https://www.nist.gov/itl/ai-risk-management-framework
    - 关键上下文：Govern；Manage
    detection:
      type: capability_chain
      include_globs: *id001
      signals:
        file_read:
        - readFile
        - open\(
        - fs\.read
        - cat\s+
        - glob
        - Files\.read
        - FileInputStream
        - ioutil\.ReadFile
        - os\.ReadFile
        - Storage\:\:get
        - file_get_contents
        - fopen\(
        - ReadAllText
        - ReadAllBytes
        - CopyTo\(
        file_write:
        - writeFile
        - fs\.write
        - open\(.+["\']w
        - '>\s*[^>]'
        - touch\s+
        - Files\.write
        - Files\.copy
        - FileOutputStream
        - os\.WriteFile
        - ioutil\.WriteFile
        - SaveUploadedFile
        - transferTo\(
        - Storage\:\:put
        - file_put_contents
        - Files.copy
        - Path\.of
        - System\.IO\.File\.WriteAll
        - CopyToAsync
        - fwrite\(
        exec:
        - os\.system
        - subprocess
        - exec\(
        - spawn\(
        - Runtime\.getRuntime
        - ProcessBuilder
        - system\(
        - passthru\(
        - shell_exec\(
        - execSync\(
        - child_process
        - Start-Process
        - CreateProcess
        - ShellExecute
        - cmd\.exe
        - powershell\.exe
        - Runtime\.exec
        - os\/exec
        - Command\(
        - proc_open\(
      pass_if: any_signal_missing
      reason: 同时存在高危闭环信号且缺少覆盖整条链路的整体审批控制时视为未通过
      control_signals:
        approval:
        - approval
        - manual_review
        - human_review
        - confirm
        - workflow approval
        - policy gate
        global_approval:
        - overall approval
        - chain approval
        - unified approval
        - global gate
      match_logic: chain_without_control
      fail_when: read_write_exec_signals_present_and_global_approval_missing
    pass_condition: chain_missing_or_control_present
    on_fail:
      action: block
      reason: 未通过静态规则：检查高危组合是否只做分段审批而缺少整体审批
  - id: S3-01-008
    item: 检查凭据访问能力是否可直接连接外部网络
    stage: 设计阶段
    risk_personal: 高
    risk_nonpersonal: 高
    detection_target: 检测具备凭据访问能力的技能在组合后是否可直接接入外部网络并形成凭据外发链，重点核查凭据读取、共享上下文和网络发送能力的联动。
    detection_method: 静态组合链路分析+人工复核。原因：组合风险取决于多个技能声明、输入输出关系和控制边界的静态可达路径，应通过静态链路分析判断。
    verification_steps:
    - 1. 识别可读取凭据的技能以及具备 HTTP、Webhook、Socket 等外联能力的技能。
    - 2. 检查凭据字段是否会经共享上下文、中间结果或参数传递直接进入外联请求。
    - 3. 通过静态扫描与配置复核确认凭据访问能力与外联能力组合后是否可直接把凭据发送到外部目标。
    fix_suggestion: 增加数据脱敏，跨技能调用二次鉴权。同时补充最小权限、默认拒绝、输入校验、统一日志和显式审批。
    source_context:
    - OWASP Top 10 for LLM Applications - LLM06 Sensitive Information Disclosure
    - 链接：https://genai.owasp.org/llm-top-10/llm06-sensitive-information-disclosure/
    - 关键上下文：Description；Example Attack Scenarios；Prevention and Mitigation
    - OWASP AI Agent Security Cheat Sheet
    - 链接：https://cheatsheetseries.owasp.org/cheatsheets/AI_Agent_Security_Cheat_Sheet.html
    - 关键上下文：Multi-Agent Environment；Tool Security & Least Privilege
    detection:
      type: capability_chain
      include_globs: *id001
      signals:
        credential:
        - token
        - api[_-]?key
        - secret
        - Authorization
        network:
        - requests\.
        - httpx\.
        - fetch\(
        - axios
        - webhook
        - socket
        - HttpClient
        - RestTemplate
        - WebClient
        - URLSession
        - OkHttp
        - GuzzleHttp
        - net\/http
        - curl_exec
        - file_get_contents\(.+https?://
        - socket_connect
        - ws://
        - wss://
      pass_if: any_signal_missing
      reason: 同时存在凭据处理与外联信号，且缺少白名单、脱敏或二次鉴权控制时视为未通过
      control_signals:
        egress:
        - allowlist
        - whitelist
        - trusted_host
        - approved_domain
        - egress policy
        masking:
        - redact
        - mask
        - drop secret
        approval:
        - approval
        - manual_review
        - human_review
        - confirm
      match_logic: chain_without_control
      fail_when: credential_and_network_signals_present_and_control_signals_missing
    pass_condition: chain_missing_or_control_present
    on_fail:
      action: block
      reason: 未通过静态规则：检查凭据访问能力是否可直接连接外部网络
  - id: S3-01-009
    item: 检查隐私数据访问能力是否可直接连接外部网络
    stage: 设计阶段
    risk_personal: 高
    risk_nonpersonal: 高
    detection_target: 检测具备隐私数据访问能力的技能在组合后是否可直接连到外部网络并形成隐私数据外发链，重点核查隐私数据读取与外联能力的联动。
    detection_method: 静态组合链路分析+人工复核。原因：组合风险取决于多个技能声明、输入输出关系和控制边界的静态可达路径，应通过静态链路分析判断。
    verification_steps:
    - 1. 识别可读取隐私数据的技能以及具备外联能力的技能。
    - 2. 检查隐私字段是否会经共享上下文、参数或缓存传入外联请求。
    - 3. 通过静态扫描与配置复核确认读取到的隐私数据是否可被后续外联技能直接发往外部目标。
    fix_suggestion: 增加数据脱敏，跨技能调用二次鉴权。同时补充最小权限、默认拒绝、输入校验、统一日志和显式审批。
    source_context:
    - OWASP Top 10 for LLM Applications - LLM06 Sensitive Information Disclosure
    - 链接：https://genai.owasp.org/llm-top-10/llm06-sensitive-information-disclosure/
    - 关键上下文：Description；Example Attack Scenarios；Prevention and Mitigation
    - OWASP AI Agent Security Cheat Sheet
    - 链接：https://cheatsheetseries.owasp.org/cheatsheets/AI_Agent_Security_Cheat_Sheet.html
    - 关键上下文：Multi-Agent Environment；Tool Security & Least Privilege
    detection:
      type: capability_chain
      include_globs: *id001
      signals:
        privacy:
        - email
        - phone
        - address
        - user[_-]?profile
        network:
        - requests\.
        - httpx\.
        - fetch\(
        - axios
        - webhook
        - socket
        - HttpClient
        - RestTemplate
        - WebClient
        - URLSession
        - OkHttp
        - GuzzleHttp
        - net\/http
        - curl_exec
        - file_get_contents\(.+https?://
        - socket_connect
        - ws://
        - wss://
      pass_if: any_signal_missing
      reason: 同时存在隐私数据处理与外联信号，且缺少白名单、脱敏或最小化控制时视为未通过
      control_signals:
        egress:
        - allowlist
        - whitelist
        - trusted_host
        - approved_domain
        - egress policy
        masking:
        - redact
        - mask
        - minimize
        - field filter
        approval:
        - approval
        - manual_review
        - human_review
        - confirm
      match_logic: chain_without_control
      fail_when: privacy_and_network_signals_present_and_control_signals_missing
    pass_condition: chain_missing_or_control_present
    on_fail:
      action: block
      reason: 未通过静态规则：检查隐私数据访问能力是否可直接连接外部网络
  - id: S3-01-010
    item: 检查高权限 HTTP 外联目标是否缺少白名单限制
    stage: 设计阶段
    risk_personal: 中
    risk_nonpersonal: 高
    detection_target: 检测高权限 HTTP 外联能力在组合链中是否缺少目标白名单限制，重点核查 AI 或下游技能能否把敏感结果发往任意 HTTP 目标。
    detection_method: 静态组合链路分析+人工复核。原因：组合风险取决于多个技能声明、输入输出关系和控制边界的静态可达路径，应通过静态链路分析判断。
    verification_steps:
    - 1. 列出所有高权限 HTTP 外联技能的可访问目标范围。
    - 2. 检查外联目标是否受白名单、域名策略或固定路由限制。
    - 3. 通过静态扫描与配置复核确认组合链是否可把敏感数据发送到未声明的 HTTP 目标。
    fix_suggestion: 增加数据脱敏，跨技能调用二次鉴权。同时补充最小权限、默认拒绝、输入校验、统一日志和显式审批。
    source_context:
    - OWASP AI Agent Security Cheat Sheet
    - 链接：https://cheatsheetseries.owasp.org/cheatsheets/AI_Agent_Security_Cheat_Sheet.html
    - 关键上下文：Least Privilege；Multi-Agent Environment；Tool Security & Least Privilege
    detection:
      type: require_pattern
      include_globs: &id003
      - '**/*.py'
      - '**/*.js'
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.jsx'
      - '**/*.go'
      - '**/*.java'
      - '**/*.rb'
      - '**/*.php'
      - '**/*.sh'
      - '**/*.bash'
      - '**/*.zsh'
      - '**/*.ps1'
      - '**/*.json'
      - '**/*.yaml'
      - '**/*.yml'
      - '**/*.toml'
      - '**/*.ini'
      - '**/*.conf'
      - '**/*.env*'
      - '**/Dockerfile'
      - '**/Makefile'
      - '**/*.md'
      - SKILL.md
      - README*
      - docs/**/*.md
      - '**/*.yaml'
      - '**/*.yml'
      - '**/*.json'
      patterns: &id002
      - allowlist
      - whitelist
      - trusted[_-]?host
      - allowedHosts
      pass_if: match_found
      reason: 未发现 HTTP 目标白名单、可信域或固定目标控制信号时判定未通过
      required_patterns: *id002
      alternative_control_patterns:
      - allowlist
      - whitelist
      - trusted_host
      - approved_domain
      - base_url
      - fixed endpoint
      - allowedHosts
      match_logic: require_any_control_pattern
      fail_when: required_patterns_all_missing
    pass_condition: control_match_found
    on_fail:
      action: block
      reason: 未通过静态规则：检查高权限 HTTP 外联目标是否缺少白名单限制
  - id: S3-01-011
    item: 检查高权限 Webhook 或 Socket 外联目标是否缺少白名单限制
    stage: 设计阶段
    risk_personal: 中
    risk_nonpersonal: 高
    detection_target: 检测高权限 Webhook 或 Socket 外联能力在组合链中是否缺少目标白名单限制，重点核查持续连接或回调能力是否可被导向任意目标。
    detection_method: 静态组合链路分析+人工复核。原因：组合风险取决于多个技能声明、输入输出关系和控制边界的静态可达路径，应通过静态链路分析判断。
    verification_steps:
    - 1. 盘点 Webhook、Socket、长连接等外联技能的目标控制方式。
    - 2. 检查目标地址是否受白名单、协议限制或固定配置保护。
    - 3. 通过静态扫描与配置复核确认组合链是否可建立到未声明目标的 Webhook 回调或 Socket 连接。
    fix_suggestion: 增加数据脱敏，跨技能调用二次鉴权。同时补充最小权限、默认拒绝、输入校验、统一日志和显式审批。
    source_context:
    - OWASP AI Agent Security Cheat Sheet
    - 链接：https://cheatsheetseries.owasp.org/cheatsheets/AI_Agent_Security_Cheat_Sheet.html
    - 关键上下文：Least Privilege；Multi-Agent Environment；Tool Security & Least Privilege
    detection:
      type: require_pattern
      include_globs: *id003
      patterns: &id004
      - allowlist
      - whitelist
      - trusted[_-]?host
      - allowedHosts
      pass_if: match_found
      reason: 未发现 Webhook 或 Socket 目标白名单、可信域或固定目标控制信号时判定未通过
      required_patterns: *id004
      alternative_control_patterns:
      - allowlist
      - whitelist
      - trusted_host
      - approved_domain
      - fixed endpoint
      - allowedOrigins
      - allowedHosts
      match_logic: require_any_control_pattern
      fail_when: required_patterns_all_missing
    pass_condition: control_match_found
    on_fail:
      action: block
      reason: 未通过静态规则：检查高权限 Webhook 或 Socket 外联目标是否缺少白名单限制
  - id: S3-01-012
    item: 检查组合后的文件权限是否超出业务必要范围
    stage: 设计阶段
    risk_personal: /
    risk_nonpersonal: 中
    detection_target: 检测项目组同时开放多个技能后，组合得到的文件读写范围是否超出当前业务必要范围，重点核查单技能权限叠加后的总访问面。
    detection_method: 静态组合链路分析+人工复核。原因：组合风险取决于多个技能声明、输入输出关系和控制边界的静态可达路径，应通过静态链路分析判断。
    verification_steps:
    - 1. 汇总项目实际开放技能的文件读写权限矩阵。
    - 2. 计算组合后的可访问目录、可修改目录和可删除目录是否超出业务最小需求。
    - 3. 抽样验证无业务需要的目录是否仍可通过不同技能组合被访问或修改。
    fix_suggestion: 按最小必要裁剪权限。同时补充最小权限、默认拒绝、输入校验、统一日志和显式审批。
    source_context:
    - OWASP AI Agent Security Cheat Sheet
    - 链接：https://cheatsheetseries.owasp.org/cheatsheets/AI_Agent_Security_Cheat_Sheet.html
    - 关键上下文：Least Privilege；Multi-Agent Environment；Tool Security & Least Privilege
    detection:
      type: require_pattern
      include_globs: *id003
      patterns:
      - workspace
      - allowed[_-]?path
      - path[_-]?allowlist
      pass_if: match_found
      reason: 必须发现控制证据才判定通过
    pass_condition: match_found
    on_fail:
      action: require_review
      reason: 未通过静态规则：检查组合后的文件权限是否超出业务必要范围
  - id: S3-01-013
    item: 检查组合后的网络或执行权限是否超出业务必要范围
    stage: 设计阶段
    risk_personal: /
    risk_nonpersonal: 中
    detection_target: 检测项目组同时开放多个技能后，组合得到的网络访问或执行权限是否超出业务必要范围，重点核查权限叠加后的总能力面。
    detection_method: 静态组合链路分析+人工复核。原因：组合风险取决于多个技能声明、输入输出关系和控制边界的静态可达路径，应通过静态链路分析判断。
    verification_steps:
    - 1. 汇总项目实际开放技能的网络、执行和系统调用权限。
    - 2. 比对这些组合权限与项目业务目标是否一致。
    - 3. 抽样验证是否存在与当前业务无关但仍可被组合调用的执行或外联能力。
    fix_suggestion: 按最小必要裁剪权限。同时补充最小权限、默认拒绝、输入校验、统一日志和显式审批。
    source_context:
    - OWASP AI Agent Security Cheat Sheet
    - 链接：https://cheatsheetseries.owasp.org/cheatsheets/AI_Agent_Security_Cheat_Sheet.html
    - 关键上下文：Least Privilege；Multi-Agent Environment；Tool Security & Least Privilege
    detection:
