    risk_nonpersonal: 高
    detection_target: 检测路径遍历或越权读取能力是否可为 SSRF 类技能提供敏感目标信息，重点核查本地读取结果是否能帮助后续外联定位内网或管理端目标。
    detection_method: 静态组合链路分析+人工复核。原因：组合风险取决于多个技能声明、输入输出关系和控制边界的静态可达路径，应通过静态链路分析判断。
    verification_steps:
    - 1. 识别可读取配置、凭据或网络信息的路径遍历类技能。
    - 2. 检查读取结果是否会被下游外联技能用作 URL、主机名、端口或认证信息。
    - 3. 通过静态扫描与配置复核确认本地读取结果是否会直接增强后续 SSRF 或内网访问能力。
    fix_suggestion: 修复漏洞，关键路径隔离。同时补充最小权限、默认拒绝、输入校验、统一日志和显式审批。
    source_context:
    - OWASP SSRF Prevention Cheat Sheet
    - 链接：https://cheatsheetseries.owasp.org/cheatsheets/Server_Side_Request_Forgery_Prevention_Cheat_Sheet.html
    - 关键上下文：Case 1；Application Layer；Network Layer
    - OWASP AI Agent Security Cheat Sheet
    - 链接：https://cheatsheetseries.owasp.org/cheatsheets/AI_Agent_Security_Cheat_Sheet.html
    - 关键上下文：Multi-Agent Environment；Tool Security & Least Privilege
    detection:
      type: capability_chain
      include_globs: *id001
      signals:
        file_read:
        - readFile
        - open\(
        - fs\.read
        - cat\s+
        - glob
        - Files\.read
        - FileInputStream
        - ioutil\.ReadFile
        - os\.ReadFile
        - Storage\:\:get
        - file_get_contents
        - fopen\(
        - ReadAllText
        - ReadAllBytes
        - CopyTo\(
        ssrf:
        - 169\.254\.169\.254
        - localhost
        - 127\.0\.0\.1
        - allow_redirects
        network:
        - requests\.
        - httpx\.
        - fetch\(
        - axios
        - webhook
        - socket
        - HttpClient
        - RestTemplate
        - WebClient
        - URLSession
        - OkHttp
        - GuzzleHttp
        - net\/http
        - curl_exec
        - file_get_contents\(.+https?://
        - socket_connect
        - ws://
        - wss://
      pass_if: any_signal_missing
      reason: 本地读取与 SSRF/外联信号同时存在时视为具备路径遍历+SSRF 组合潜力
    pass_condition: any_signal_missing
    on_fail:
      action: block
      reason: 未通过静态规则：检查路径遍历能力是否可为 SSRF 提供敏感目标信息
  - id: S3-05-002
    item: 检查路径遍历与 SSRF 组合后是否可触达内网资产
    stage: 设计阶段
    risk_personal: 中
    risk_nonpersonal: 高
    detection_target: 检测路径遍历与 SSRF 类技能组合后是否可触达原本不可见的内网资产，重点核查本地信息泄露与外联探测之间的联动。
    detection_method: 静态组合链路分析+人工复核。原因：组合风险取决于多个技能声明、输入输出关系和控制边界的静态可达路径，应通过静态链路分析判断。
    verification_steps:
    - 1. 识别路径遍历技能可泄露的网络配置、凭据或目标清单。
    - 2. 检查这些结果是否会被下游 SSRF 技能直接使用。
    - 3. 通过静态扫描与配置复核确认组合链是否可触达内网服务、管理端点或元数据地址。
    fix_suggestion: 修复漏洞，关键路径隔离。同时补充最小权限、默认拒绝、输入校验、统一日志和显式审批。
    source_context:
    - OWASP SSRF Prevention Cheat Sheet
