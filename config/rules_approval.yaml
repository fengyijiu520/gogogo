      patterns:
      - allowlist
      - disable_exec
      - disable_network
      - capability[_-]?policy
      pass_if: match_found
      reason: 必须发现控制证据才判定通过
    pass_condition: match_found
    on_fail:
      action: require_review
      reason: 未通过静态规则：检查组合后的网络或执行权限是否超出业务必要范围
  - id: S3-01-014
    item: 检查命令执行能力是否支持按场景关闭
    stage: 设计阶段
    risk_personal: 高
    risk_nonpersonal: 高
    detection_target: 检测项目在多技能环境中是否可按场景关闭命令执行能力，重点核查高风险执行技能是否支持按任务、环境或流程裁剪。
