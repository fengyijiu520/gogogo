    pass_condition: any_signal_missing
    on_fail:
      action: block
      reason: 未通过静态规则：检查路径遍历与 SSRF 组合后是否可触达内网资产
  - id: S3-05-003
    item: 检查注入漏洞是否可驱动越权文件读写
    stage: 设计阶段
    risk_personal: 中
    risk_nonpersonal: 高
    detection_target: 检测注入类问题在多技能环境中是否可驱动越权文件读写，重点核查一个技能中的注入点是否会把危险参数传给具有文件权限的另一个技能。
    detection_method: 静态组合链路分析+人工复核。原因：组合风险取决于多个技能声明、输入输出关系和控制边界的静态可达路径，应通过静态链路分析判断。
    verification_steps:
    - 1. 识别存在命令、模板、SQL 或路径注入风险的技能。
    - 2. 检查注入结果是否会影响具有读写文件权限的下游技能。
    - 3. 通过静态扫描与配置复核确认构造输入是否可经组合链触发越权读写。
    fix_suggestion: 修复输入校验，阻断执行链路。同时补充最小权限、默认拒绝、输入校验、统一日志和显式审批。
    source_context:
    - OWASP Input Validation Cheat Sheet
    - 链接：https://cheatsheetseries.owasp.org/cheatsheets/Input_Validation_Cheat_Sheet.html
